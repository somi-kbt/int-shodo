<style>
  :root { --bg:#15102e; --panel:rgba(30,22,64,.86); --fg:#fff; --mute:#b9b0e0;
    --pink:#ff4fa3; --cyan:#2ee6ff; --yellow:#ffe23d; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg); overflow:hidden;
    font-family:"M PLUS Rounded 1c",-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif; }
  #stage { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  #cv { max-width:100%; max-height:100%; }
  #gl { position:fixed; inset:0; width:100%; height:100%; touch-action:none; }

    align-items:center; justify-content:center; text-align:center; padding:24px; z-index:6;
    background:radial-gradient(circle at 20% 15%, rgba(255,79,163,.35), transparent 45%),
               radial-gradient(circle at 85% 80%, rgba(46,230,255,.3), transparent 45%), var(--bg); }
  #start h1 { margin:0; font-size:56px; font-weight:800; letter-spacing:.12em;

  #start h1 small { display:block; font-size:14px; letter-spacing:.4em; color:var(--mute); margin-top:2px; -webkit-text-fill-color:var(--mute); }
  #start p { margin:0; color:var(--mute); line-height:1.8; max-width:440px; font-size:13px; }

  button, input { font:inherit; font-size:15px; color:var(--fg); background:rgba(255,255,255,.1); border:2px solid rgba(255,255,255,.18);
    border-radius:999px; padding:9px 16px; font-weight:800; }

  button.go { background:linear-gradient(90deg,var(--pink),#ff8a2b); border:none; color:#fff; padding:13px 28px; font-size:17px;

  .bar { position:fixed; left:50%; bottom:max(14px, env(safe-area-inset-bottom)); transform:translateX(-50%);
    display:flex; flex-wrap:wrap; gap:8px; align-items:center; justify-content:center;
    background:var(--panel); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);

  .bar button { font-size:13px; padding:8px 13px; }
  .bar label { display:flex; align-items:center; gap:6px; color:var(--mute); font-size:13px; }
  .bar input[type=range] { width:90px; accent-color:var(--pink); padding:0; border:none; }
  .bar input[type=checkbox] { width:auto; padding:0; }
  #status { position:fixed; top:max(10px, env(safe-area-inset-top)); left:12px; font-size:12px;
    color:var(--mute); background:var(--panel); padding:6px 11px; border-radius:999px; z-index:4; }
  #room { position:fixed; top:max(10px, env(safe-area-inset-top)); right:12px; font-size:12px; z-index:4;
    background:var(--panel); padding:5px 6px 5px 12px; border-radius:999px; display:flex; gap:8px; align-items:center; max-width:62vw; }
  #room button { font-size:12px; padding:5px 10px; }
  #timer { position:fixed; top:max(14px, env(safe-area-inset-top)); left:50%; transform:translateX(-50%);
    font-size:44px; font-weight:800; z-index:5; text-shadow:0 0 18px var(--pink); pointer-events:none; }
  #timer.big { top:50%; transform:translate(-50%,-50%); font-size:140px;
    background:linear-gradient(90deg,var(--pink),var(--yellow),var(--cyan)); -webkit-background-clip:text; background-clip:text; color:transparent; text-shadow:none; }
  #score { position:fixed; top:max(16px, env(safe-area-inset-top)); left:50%; transform:translateX(-50%); text-align:center; z-index:4; pointer-events:none; }
  #score b { display:block; font-size:44px; font-weight:800;
    background:linear-gradient(90deg,var(--pink),var(--yellow),var(--cyan)); -webkit-background-clip:text; background-clip:text; color:transparent; }
  #score span { font-size:14px; color:var(--fg); }
  #toast { position:fixed; left:50%; top:38%; transform:translateX(-50%); background:var(--panel); padding:12px 18px;
    border-radius:999px; font-size:15px; font-weight:800; z-index:7; }
  #dlg { position:fixed; inset:0; z-index:20; display:flex; align-items:center; justify-content:center; padding:20px;
    background:rgba(0,0,0,.6); }
  #dlg .box { background:#1d1530; border:2px solid rgba(255,255,255,.18); border-radius:22px; padding:22px 22px 18px;
    max-width:420px; width:100%; text-align:left; box-shadow:0 10px 40px rgba(0,0,0,.5); }
  #dlg h2 { margin:0 0 10px; font-size:19px; }
  #dlg .msg { font-size:14px; line-height:1.8; color:var(--fg); white-space:pre-line; }
  #dlg .detail { font-size:11px; color:var(--mute); margin-top:10px; word-break:break-all; }
  #dlg .row { margin-top:16px; justify-content:flex-end; }

<body>
<div id="start">
  <h1>合書<small>GASSHO</small></h1>
  <p class="how">はなれたふたりで、いっしょに書いて、いっしょに鳴らす。<br>5本の指先がまるい筆。ひらくと太く、すぼめると細く、グーでストップ。<br>速く動かすと、シュッと線が飛びだす！</p>
  <div class="label">自分の色をえらぶ</div>
  <div class="chips" id="chipsStart"></div>
  <button class="go" id="host">部屋をつくる</button>

<div id="stage"><canvas id="cv"></canvas></div>
<canvas id="gl" class="hidden"></canvas>

    <div class="detail" id="dlgDetail"></div>
    <div class="row"><button id="dlgClose">閉じる</button><button id="dlgRetry" class="go">もう一度ためす</button></div>
  </div>
</div>

<div id="barCam" class="bar hidden">

  <button id="soundBtn">🔊 音テスト</button>

</div>

<div id="barView" class="bar hidden">

  <label><input id="base" type="checkbox" checked> 台座</label>
  <label><input id="autoRot" type="checkbox" checked> くるくる</label>
  <button id="front">正面</button>
  <button id="save">🧊 3Dプリント用（2色）</button>
  <button id="again" class="go">もう一回！</button>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { FilesetResolver, HandLandmarker } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

window.__gasshoReady = true;
const $ = id => document.getElementById(id);
const video = $("video"), cv = $("cv"), ctx = cv.getContext("2d");
const statusEl = $("status"), timerEl = $("timer");
const TIPS = [4, 8, 12, 16, 20];
const FINGERS = [[8, 5], [12, 9], [16, 13], [20, 17]];    // [tip, knuckle] for index..pinky
const GAP_MS = 500;
const REC_SEC = 15;
const COLORS = [
  ["ピンク", "#ff4fa3"], ["ソーダ", "#2ee6ff"], ["レモン", "#ffe23d"],
  ["ライム", "#7dff5a"], ["オレンジ", "#ff8a2b"], ["パープル", "#a77bff"],
];
let myColor = COLORS[0][1];

let landmarker = null, stream = null, facing = "user", lastVideoTime = -1;
let mode = "idle";                           // idle | ready | count | rec | view
let modeT0 = 0, lastCount = null;
const ink = document.createElement("canvas"), ictx = ink.getContext("2d");
const live = new Map(), peerLive = new Map();
let strokes = [], strokeCounter = 0;
let fx = [];                                 // short-lived effects: speed lines, stars, rings
let sync = { sum: 0, n: 0 };
let peerScore = null, scoreWait = null;     // the partner's half of the sync score; both sides add the two halves

const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const lerp = (a, b, t) => a.map((v, k) => v + (b[k] - v) * t);
const centroid = pts => pts[0].map((_, k) => pts.reduce((s, p) => s + p[k], 0) / pts.length);
const dist = (a, b) => Math.hypot(...a.map((v, k) => v - b[k]));
const r4 = v => Math.round(v * 1e4) / 1e4;

function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.classList.remove("hidden");
  clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.add("hidden"), 1600);
}
function peerColor(c) {                      // keep the two people apart if they picked the same colour
  if (!c) return COLORS[1][1];
  if (c.toLowerCase() !== myColor.toLowerCase()) return c;
  return COLORS[(COLORS.findIndex(x => x[1] === myColor) + 3) % COLORS.length][1];
}

// colour chips
function buildChips(el) {
  el.innerHTML = "";
  for (const [name, c] of COLORS) {
    const b = document.createElement("button");
    b.className = "chip" + (c === myColor ? " on" : ""); b.title = name; b.setAttribute("aria-label", name);
    b.style.setProperty("--c", c);
    b.onclick = () => { myColor = c; buildChips($("chipsStart")); buildChips($("chipsBar")); unlockAudio(); pop(true, 0); };
    el.appendChild(b);
  }
}
buildChips($("chipsStart")); buildChips($("chipsBar"));

// ======================================================================
// SOUND — pop & playful. Moving the brush plays notes (me: marimba, partner: synth pluck) on a
// shared pentatonic scale; a beat runs while recording; fast swipes whoosh; pen down pops;
// brushes meeting sparkle.
// ======================================================================
let ac = null, master = null, verb = null, noiseBuf = null, unlockEl = null;
function silentWav() {                       // tiny silent WAV, played through <audio> so iPhones ignore the mute switch
  const n = 800, b = new ArrayBuffer(44 + n), v = new DataView(b);
  const w = (o, s) => [...s].forEach((c, i) => v.setUint8(o + i, c.charCodeAt(0)));
  w(0, "RIFF"); v.setUint32(4, 36 + n, true); w(8, "WAVE"); w(12, "fmt ");
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, 8000, true); v.setUint32(28, 8000, true); v.setUint16(32, 1, true); v.setUint16(34, 8, true);
  w(36, "data"); v.setUint32(40, n, true); for (let i = 0; i < n; i++) v.setUint8(44 + i, 128);
  let s = ""; new Uint8Array(b).forEach(x => s += String.fromCharCode(x));
  return "data:audio/wav;base64," + btoa(s);
}
function unlockAudio() {
  try { if (navigator.audioSession) navigator.audioSession.type = "playback"; } catch {}
  if (!unlockEl) { unlockEl = new Audio(silentWav()); unlockEl.loop = true; unlockEl.setAttribute("playsinline", ""); }
  unlockEl.play().catch(() => {});
  if (!ac) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ac = new AC();
    const comp = ac.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 4;
    master = ac.createGain(); master.gain.value = 0.9;
    master.connect(comp).connect(ac.destination);
    const conv = ac.createConvolver();
    const len = ac.sampleRate * 1.4, ir = ac.createBuffer(2, len, ac.sampleRate);
    for (let c = 0; c < 2; c++) { const d = ir.getChannelData(c); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len) ** 3; }
    conv.buffer = ir;
    verb = ac.createGain(); verb.gain.value = 0.25; verb.connect(conv).connect(master);
    noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  if (ac.state !== "running") ac.resume();
}
addEventListener("pointerdown", () => { if (ac && ac.state !== "running") ac.resume(); });

const hz = m => 440 * 2 ** ((m - 69) / 12);
const PENTA = [0, 2, 4, 7, 9];
const noteFor = (y, base) => { const i = Math.round((1 - clamp(y, 0, 1)) * 12); return base + 12 * Math.floor(i / 5) + PENTA[i % 5]; };
function out(pan) {                          // panned output into master + a bit of reverb
  const g = ac.createGain();
  let tail = g;
  if (ac.createStereoPanner) { const p = ac.createStereoPanner(); p.pan.value = clamp(pan, -1, 1); g.connect(p); tail = p; }
  tail.connect(master); tail.connect(verb);
  return g;
}
function env(g, t, peak, a, d) { g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + a + d); }
function marimba(m, vel, pan) {
  if (!ac) return; const t = ac.currentTime, o = out(pan);
  [[1, 1, 0.55], [4, 0.28, 0.12], [10, 0.08, 0.05]].forEach(([r, a, d]) => {
    const osc = ac.createOscillator(), g = ac.createGain();
    osc.type = "sine"; osc.frequency.value = hz(m) * r;
    env(g, t, 0.32 * vel * a, 0.004, d); osc.connect(g).connect(o); osc.start(t); osc.stop(t + d + 0.05);
  });
}
function pluck(m, vel, pan) {
  if (!ac) return; const t = ac.currentTime, o = out(pan);
  const osc = ac.createOscillator(), lp = ac.createBiquadFilter(), g = ac.createGain();
  osc.type = "sawtooth"; osc.frequency.value = hz(m);
  lp.type = "lowpass"; lp.Q.value = 6; lp.frequency.setValueAtTime(4500, t); lp.frequency.exponentialRampToValueAtTime(500, t + 0.25);
  env(g, t, 0.16 * vel, 0.004, 0.35);
  osc.connect(lp).connect(g).connect(o); osc.start(t); osc.stop(t + 0.4);
  const s = ac.createOscillator(), sg = ac.createGain();
  s.type = "sine"; s.frequency.value = hz(m) * 2; env(sg, t, 0.08 * vel, 0.004, 0.3);
  s.connect(sg).connect(o); s.start(t); s.stop(t + 0.35);
}
function pop(up, pan) {                      // pen down: blip up / pen up: blip down
  if (!ac) return; const t = ac.currentTime, o = out(pan);
  const osc = ac.createOscillator(), g = ac.createGain();
  osc.type = "sine";
  osc.frequency.setValueAtTime(up ? 380 : 700, t); osc.frequency.exponentialRampToValueAtTime(up ? 1100 : 260, t + 0.09);
  env(g, t, 0.35, 0.004, 0.12); osc.connect(g).connect(o); osc.start(t); osc.stop(t + 0.16);
}
function whoosh(pan, strength) {
  if (!ac) return; const t = ac.currentTime, o = out(pan);
  const n = ac.createBufferSource(), bp = ac.createBiquadFilter(), g = ac.createGain();
  n.buffer = noiseBuf; bp.type = "bandpass"; bp.Q.value = 1.2;
  bp.frequency.setValueAtTime(500, t); bp.frequency.exponentialRampToValueAtTime(3500 + 2000 * strength, t + 0.28);
  env(g, t, 0.35 * strength, 0.03, 0.3); n.connect(bp).connect(g).connect(o); n.start(t); n.stop(t + 0.4);
}
function sparkleSound() {
  if (!ac) return; const t0 = ac.currentTime;
  [84, 88, 91, 96, 100].forEach((m, i) => {
    const t = t0 + i * 0.045, o = out((i % 2 ? 0.5 : -0.5));
    const osc = ac.createOscillator(), g = ac.createGain();
    osc.type = "triangle"; osc.frequency.value = hz(m);
    env(g, t, 0.12, 0.003, 0.45); osc.connect(g).connect(o); osc.start(t); osc.stop(t + 0.5);
  });
}
function beep(m, len = 0.18, vol = 0.25) {
  if (!ac) return; const t = ac.currentTime, o = out(0);
  const osc = ac.createOscillator(), g = ac.createGain();
  osc.type = "square"; osc.frequency.value = hz(m);
  const lp = ac.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 2500;
  env(g, t, vol, 0.005, len); osc.connect(lp).connect(g).connect(o); osc.start(t); osc.stop(t + len + 0.05);
}
function fanfare() {
  if (!ac) return;
  [[67, 0], [72, 0.12], [76, 0.24], [79, 0.36], [84, 0.5]].forEach(([m, d]) => setTimeout(() => { marimba(m, 1, 0); pluck(m - 12, 0.8, 0); }, d * 1000));
  setTimeout(sparkleSound, 650);
}
// beat: kick / clap / hats at 116 BPM while recording
let beatTimer = null, nextT = 0, step = 0;
const BPM = 116;
function kick(t) { const o = ac.createOscillator(), g = ac.createGain(); o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(45, t + 0.12); env(g, t, 0.55, 0.003, 0.18); o.connect(g).connect(master); o.start(t); o.stop(t + 0.25); }
function hat(t, v) { const n = ac.createBufferSource(), hp = ac.createBiquadFilter(), g = ac.createGain(); n.buffer = noiseBuf; hp.type = "highpass"; hp.frequency.value = 7000; env(g, t, v, 0.002, 0.04); n.connect(hp).connect(g).connect(master); n.start(t); n.stop(t + 0.06); }
function clap(t) { const n = ac.createBufferSource(), bp = ac.createBiquadFilter(), g = ac.createGain(); n.buffer = noiseBuf; bp.type = "bandpass"; bp.frequency.value = 1500; bp.Q.value = 0.8; env(g, t, 0.28, 0.003, 0.14); n.connect(bp).connect(g); g.connect(master); g.connect(verb); n.start(t); n.stop(t + 0.2); }
function beatOn() {
  if (!ac || beatTimer) return;
  nextT = ac.currentTime + 0.05; step = 0;
  beatTimer = setInterval(() => {
    while (nextT < ac.currentTime + 0.12) {
      const s = step % 16;
      if (s === 0 || s === 8 || s === 10) kick(nextT);
      if (s === 4 || s === 12) clap(nextT);
      if (s % 2 === 0) hat(nextT, s % 4 === 2 ? 0.09 : 0.05);
      nextT += 60 / BPM / 4; step++;
    }
  }, 25);
}
function beatOff() { clearInterval(beatTimer); beatTimer = null; }
$("soundBtn").onclick = () => { unlockAudio(); marimba(72, 1, -0.4); setTimeout(() => pluck(79, 1, 0.4), 140); setTimeout(sparkleSound, 300); };

// play notes as a brush travels; returns events for visuals
function musicFor(s, who, x, y, r, speed, writingish, pan) {
  const now = performance.now();
  if (!writingish) { s.mx = x; s.my = y; return; }
  if (s.mx == null) { s.mx = x; s.my = y; }
  const moved = Math.hypot(x - s.mx, (y - s.my) * 0.6);
  if (moved > 0.045 && now - (s.lastNote || 0) > 70) {
    const vel = 0.45 + 0.55 * smooth(0, 0.2, r);
    const base = who === "me" ? 55 - (r > 0.12 ? 12 : 0) : 67 - (r > 0.12 ? 12 : 0);   // fat brush → an octave lower
    (who === "me" ? marimba : pluck)(noteFor(y, base), vel, pan);
    s.lastNote = now; s.mx = x; s.my = y;
  }
  if (speed > 1.3 && now - (s.lastWhoosh || 0) > 380) { whoosh(pan, clamp((speed - 1.3) / 1.5, 0.3, 1)); s.lastWhoosh = now; }
}

// ======================================================================
// FX — speed lines, stars, rings (drawn over the picture, fade quickly)
// ======================================================================
function speedLines(x, y, dx, dy, r, speed, col, permanent) {
  const n = Math.min(6, 2 + Math.floor(speed * 2));
  const len = (60 + 160 * clamp(speed - 0.9, 0, 2)) * (cv.width / 1280);
  for (let i = 0; i < n; i++) {
    const off = (Math.random() * 2 - 1) * (r + 14);
    const back = r + Math.random() * 30;
    const sx = x - dx * back - dy * off, sy = y - dy * back + dx * off;
    const L = len * (0.5 + Math.random() * 0.7);
    fx.push({ type: "line", x: sx, y: sy, x2: sx - dx * L, y2: sy - dy * L, col: Math.random() < 0.5 ? "#ffffff" : col, life: 260, t: performance.now() });
    if (permanent && i < 2) {               // leave a few faint streaks in the artwork too
      ictx.strokeStyle = col; ictx.globalAlpha = 0.45; ictx.lineWidth = 1.6 * (cv.width / 1280);
      ictx.beginPath(); ictx.moveTo(sx, sy); ictx.lineTo(sx - dx * L * 0.7, sy - dy * L * 0.7); ictx.stroke(); ictx.globalAlpha = 1;
    }
  }
}
function stars(x, y, col, n, power = 1) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, sp = (1 + Math.random() * 3) * power;
    fx.push({ type: "star", x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, size: 4 + Math.random() * 6, col: Math.random() < 0.3 ? "#fff" : col, life: 600, t: performance.now() });
  }
}
function ring(x, y, col) { fx.push({ type: "ring", x, y, col, life: 500, t: performance.now() }); }
function starPath(g, x, y, r) {
  g.beginPath();
  for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.45 : r; g.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); }
  g.closePath();
}
function drawFx(now) {
  const sc = cv.width / 1280;
  fx = fx.filter(f => now - f.t < f.life);
  for (const f of fx) {
    const k = 1 - (now - f.t) / f.life;
    ctx.globalAlpha = k;
    if (f.type === "line") {
      ctx.strokeStyle = f.col; ctx.lineWidth = 3 * sc * k + 0.5; ctx.lineCap = "round";
      ctx.beginPath(); ctx.moveTo(f.x, f.y); ctx.lineTo(f.x2, f.y2); ctx.stroke();
    } else if (f.type === "star") {
      f.x += f.vx * sc * 2; f.y += f.vy * sc * 2; f.vy += 0.08;
      ctx.fillStyle = f.col; ctx.shadowColor = f.col; ctx.shadowBlur = 10 * sc;
      starPath(ctx, f.x, f.y, f.size * sc * (0.5 + k * 0.5)); ctx.fill(); ctx.shadowBlur = 0;
    } else if (f.type === "ring") {
      ctx.strokeStyle = f.col; ctx.lineWidth = 4 * sc * k;
      ctx.beginPath(); ctx.arc(f.x, f.y, (1 - k) * 160 * sc + 10, 0, Math.PI * 2); ctx.stroke();
    }
  }

}

let peer = null, conn = null, roomCode = null, isHost = false;

function send(m) { if (conn && conn.open) { try { conn.send(m); } catch {} } }
function setupHost() {
  isHost = true;
  const code = String(1000 + Math.floor(Math.random() * 9000));
  peer = new Peer("gassho-room-" + code, { debug: 0 });
  roomUI("準備中…");
  peer.on("open", () => { roomCode = code; roomUI("相手を待っています"); });
  peer.on("connection", c => {
    if (conn && conn.open) { c.on("open", () => c.close()); return; }
    attach(c);
  });
  peer.on("disconnected", () => { try { peer.reconnect(); } catch {} });
  peer.on("error", e => {
    if (e.type === "unavailable-id") { peer.destroy(); setupHost(); }

function setupJoin(code) {

function attach(c) {
  conn = c;

    if (!c.open) roomUI("つながりませんでした。ふたりとも同じWi-Fiにつないで、もう一度ためしてね");
  }, 15000);

  c.on("data", onMsg);

async function loadModel() {
  const fs = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
  const opts = (delegate) => ({
    baseOptions: { modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task", delegate },
    runningMode: "VIDEO", numHands: 2,
    minHandDetectionConfidence: 0.4, minHandPresenceConfidence: 0.3, minTrackingConfidence: 0.3,
  });
  try { landmarker = await HandLandmarker.createFromOptions(fs, opts("GPU")); }
  catch { landmarker = await HandLandmarker.createFromOptions(fs, opts("CPU")); }
}
let camGen = 0, camStarting = false;
async function startCamera() {
  const gen = ++camGen;
  stopCamera();
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    const e = new Error("getUserMedia is not available"); e.name = "NoMediaDevices"; throw e;
  }
  camStarting = true;
  try {
    let st;
    try {
      st = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: facing, width: { ideal: 1280 }, height: { ideal: 720 }, frameRate: { ideal: 60 } }, audio: false });
    } catch (e) {
      // some tablets reject the detailed request; try once more with the simplest one
      if (e.name !== "OverconstrainedError" && e.name !== "NotReadableError" && e.name !== "AbortError") throw e;
      st = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
    }
    if (gen !== camGen) { st.getTracks().forEach(t => t.stop()); return; }   // a newer start took over
    stream = st; camLost = false;
    st.getVideoTracks().forEach(t => t.addEventListener("ended", () => { if (stream === st) camLost = true; }));
    video.srcObject = st;
    try { await video.play(); }
    catch (e) { if (gen !== camGen) return; throw e; }
    if (gen !== camGen) return;
    lastFrameAt = performance.now();
    // resizing a canvas wipes it, so only do it when the size really changed (keeps the ink after a restart)
    if (cv.width !== video.videoWidth || cv.height !== video.videoHeight) {
      cv.width = ink.width = video.videoWidth; cv.height = ink.height = video.videoHeight;
    }
    lastVideoTime = -1;
    updateFlip();
  } finally { if (gen === camGen) camStarting = false; }
}

// ======================================================================
// my hand
// ======================================================================
function readHand(lm, W, H, mirror, prevDepth) {
  const P = i => [(mirror ? 1 - lm[i].x : lm[i].x) * W, lm[i].y * H];
  const tips2 = TIPS.map(P);
  const c2 = centroid(tips2);
  const handPx = Math.max(4, dist(P(0), P(9)));
  const spread = Math.sqrt(tips2.reduce((s, p) => s + (p[0] - c2[0]) ** 2 + (p[1] - c2[1]) ** 2, 0) / 5);
  const r2 = Math.max(1.5, spread - 0.09 * handPx);
  const handSize = handPx / H;
  const raw = 0.2 / handSize;
  const d = prevDepth == null ? raw : prevDepth * 0.8 + raw * 0.2;
  const zRel = TIPS.reduce((s, i) => s + lm[i].z, 0) / 5;
  const c3 = [(c2[0] - W / 2) / H * d, -(c2[1] - H / 2) / H * d, -(d + zRel * (W / H) * d)];
  const r3 = r2 / H * d;
  const L = i => [lm[i].x, lm[i].y, lm[i].z];
  const curled = FINGERS.filter(([t, k]) => dist(L(t), L(0)) < dist(L(k), L(0)) * 1.15).length;
  return { tips2, c2, r2, c3, r3, d, curled };
}

function updateHand(key, h, now) {
  let s = live.get(key);
  if (!s || now - s.t > GAP_MS) {
    s = { t: now, d: h.d, v: 0, fist: h.curled >= 3, hist: [], stroke: null, id: null, c2: h.c2, r2: h.r2, c3: h.c3, r3: h.r3, dir: [1, 0] };
    live.set(key, s);
  }
  const wasFist = s.fist;
  if (h.curled >= 3) s.fist = true; else if (h.curled <= 1) s.fist = false;
  const W = cv.width, H = cv.height;
  const dt = Math.max(1, now - s.t);
  const c2 = lerp(s.c2, h.c2, 0.7), c3 = lerp(s.c3, h.c3, 0.7);
  const r2 = s.r2 * 0.55 + h.r2 * 0.45, r3 = s.r3 * 0.55 + h.r3 * 0.45;
  const dd = dist(c2, s.c2);
  if (dd > 0.5) s.dir = [(c2[0] - s.c2[0]) / dd, (c2[1] - s.c2[1]) / dd];
  s.v = s.v * 0.5 + (dd / W / (dt / 1000)) * 0.5;
  Object.assign(s, { t: now, d: h.d, c2, r2, c3, r3 });

  const pan = (c2[0] / W) * 1.6 - 0.8;
  if (wasFist !== s.fist && mode !== "view") { pop(!s.fist, pan); if (!s.fist) ring(c2[0], c2[1], myColor); }
  const writing = !s.fist && mode === "rec";
  musicFor(s, "me", c2[0] / W, c2[1] / H, r2 / H, s.v, !s.fist, pan);
  if (!s.fist && s.v > 0.9) speedLines(c2[0], c2[1], s.dir[0], s.dir[1], r2, s.v, myColor, writing);
  if (!s.fist && s.v > 1.6 && Math.random() < 0.5) stars(c2[0], c2[1], myColor, 2);

  if (!writing) { s.stroke = null; s.id = null; s.hist = []; }
  else {
    if (!s.stroke) { s.id = ++strokeCounter; s.stroke = { samples: [], who: "me", col: myColor }; strokes.push(s.stroke); }
    s.hist.push({ c: c2, r: r2 }); if (s.hist.length > 3) s.hist.shift();
    paintNeon(s.hist, myColor);
    s.stroke.samples.push({ c: c3.slice(), r: r3 });
  }
  send({ t: "b", k: key, id: s.id, f: s.fist ? 1 : 0, c: [r4(c2[0] / W), r4(c2[1] / H)], r: r4(r2 / H),
         c3: c3.map(r4), r3: r4(r3), v: r4(s.v), col: myColor });
}

function onPeerBrush(m) {
  const W = cv.width, H = cv.height, now = performance.now();
  const c2 = [m.c[0] * W, m.c[1] * H], r2 = m.r * H, col = peerColor(m.col);
  let s = peerLive.get(m.k);
  if (!s) { s = { hist: [], id: null, fist: true, c2, dir: [1, 0] }; peerLive.set(m.k, s); }
  const dd = dist(c2, s.c2);
  if (dd > 0.5) s.dir = [(c2[0] - s.c2[0]) / dd, (c2[1] - s.c2[1]) / dd];
  const wasFist = s.fist, fist = !!m.f;
  Object.assign(s, { c2, r2, t: now, fist, col, v: m.v });
  const pan = m.c[0] * 1.6 - 0.8;
  if (wasFist !== fist && mode !== "view") { pop(!fist, pan); if (!fist) ring(c2[0], c2[1], col); }
  musicFor(s, "peer", m.c[0], m.c[1], m.r, m.v, !fist, pan);
  if (!fist && m.v > 0.9) speedLines(c2[0], c2[1], s.dir[0], s.dir[1], r2, m.v, col, mode === "rec" && m.id != null);
  if (!fist && m.v > 1.6 && Math.random() < 0.5) stars(c2[0], c2[1], col, 2);

  const writing = mode === "rec" && m.id != null;
  if (!writing) { s.id = null; s.hist = []; }
  else {
    if (s.id !== m.id) { s.id = m.id; s.hist = []; s.stroke = { samples: [], who: "peer", col }; strokes.push(s.stroke); }
    s.hist.push({ c: c2, r: r2 }); if (s.hist.length > 3) s.hist.shift();
    paintNeon(s.hist, col);
    s.stroke.samples.push({ c: m.c3, r: m.r3 });
  }
}

// brushes meeting → sparkle; and the sync score
let lastMeet = 0;
function together(now) {
  const mine = [...live.values()].filter(s => now - s.t < 150 && !s.fist);
  const theirs = [...peerLive.values()].filter(s => now - s.t < 250 && !s.fist);
  if (mode === "rec" && conn && conn.open) {
    const a = Math.max(0, ...mine.map(s => s.v)), b = Math.max(0, ...theirs.map(s => s.v));
    if (a + b > 0.15) { sync.sum += 1 - Math.abs(a - b) / (a + b + 0.05); sync.n++; }
  }
  if (now - lastMeet < 1200) return;
  for (const p of mine) for (const q of theirs) {
    if (dist(p.c2, q.c2) < cv.width * 0.09) {
      lastMeet = now; sparkleSound();
      const mx = (p.c2[0] + q.c2[0]) / 2, my = (p.c2[1] + q.c2[1]) / 2;
      stars(mx, my, myColor, 10, 1.6); stars(mx, my, q.col, 10, 1.6); ring(mx, my, "#ffffff");
      return;
    }
  }
}

// ======================================================================
// neon ink
// ======================================================================
const mid = (a, b) => ({ c: lerp(a.c, b.c, 0.5), r: (a.r + b.r) / 2 });
function paintNeon(hist, col) {
  const n = hist.length, g = ictx;
  if (n < 2) {
    g.fillStyle = col; g.shadowColor = col; g.shadowBlur = hist[0].r;
    g.beginPath(); g.arc(hist[0].c[0], hist[0].c[1], hist[0].r, 0, Math.PI * 2); g.fill(); g.shadowBlur = 0; return;
  }
  const A = n === 2 ? hist[0] : mid(hist[0], hist[1]), C = hist[n - 2], B = mid(hist[n - 2], hist[n - 1]);
  const curve = () => { g.beginPath(); g.moveTo(A.c[0], A.c[1]); g.quadraticCurveTo(C.c[0], C.c[1], B.c[0], B.c[1]); g.stroke(); };
  g.lineCap = "round"; g.lineJoin = "round";
  g.strokeStyle = col; g.lineWidth = Math.max(2, 2 * C.r);
  g.shadowColor = col; g.shadowBlur = Math.min(40, C.r * 0.8 + 6);
  curve();
  g.shadowBlur = 0;
  g.strokeStyle = "rgba(255,255,255,.55)"; g.lineWidth = Math.max(1, C.r * 0.45);   // bright core, like a neon tube
  curve();
}

// ======================================================================
// camera-phase loop
// ======================================================================
function compose(now) {
  const W = cv.width, H = cv.height, mirror = facing === "user", sc = W / 1280;
  ctx.fillStyle = "#15102e"; ctx.fillRect(0, 0, W, H);
  if ($("showVideo").checked) {
    ctx.save(); ctx.globalAlpha = 0.75;
    if (mirror) { ctx.translate(W, 0); ctx.scale(-1, 1); }

function zipStore(files) {                   // minimal uncompressed zip (3MF is a zip)
  const enc = new TextEncoder(), parts = [], central = [];
  let off = 0;
  for (const f of files) {
    const name = enc.encode(f.name), data = f.data, crc = crc32(data);

    h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0x0800, true);
    h.setUint32(14, crc, true); h.setUint32(18, data.length, true); h.setUint32(22, data.length, true); h.setUint16(26, name.length, true);
    parts.push(new Uint8Array(h.buffer), name, data);
    const c = new DataView(new ArrayBuffer(46));
    c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint16(8, 0x0800, true);
    c.setUint32(16, crc, true); c.setUint32(20, data.length, true); c.setUint32(24, data.length, true); c.setUint16(28, name.length, true);
    c.setUint32(42, off, true);

function export3MF() {
  if (!lastPrint) return;
  const defs = [["me", "自分"], ["peer", "相手"]].map(([who, label]) => ({ label, col: (lastPrint.find(s => s.who === who) || {}).col, list: lastPrint.filter(s => s.who === who) }))
    .filter(d => d.list.length);
  const mm = printStrokesMM(defs.map(d => d.list));
  const groups = defs.map((d, i) => ({ label: d.label, col: d.col, tris: mm[i].flatMap(S => printTube(S)) }));
  if ($("base").checked) groups.push({ label: "台座", col: "#eeeeee", tris: baseAndPosts(mm.flat()) });
  const f = v => v.toFixed(3);
  let objs = "";
  groups.forEach((g, gi) => {
    const verts = [], index = new Map(), tris = [];
    const vid = v => { if (!index.has(v)) { index.set(v, verts.length); verts.push(v); } return index.get(v); };
    for (const [a, b, c] of g.tris) tris.push([vid(a), vid(b), vid(c)]);
    objs += `<object id="${gi + 2}" name="${g.label}" type="model" pid="1" pindex="${gi}"><mesh><vertices>` +
      verts.map(v => `<vertex x="${f(v.x)}" y="${f(v.y)}" z="${f(v.z)}"/>`).join("") +
      `</vertices><triangles>` + tris.map(t => `<triangle v1="${t[0]}" v2="${t[1]}" v3="${t[2]}"/>`).join("") +
      `</triangles></mesh></object>`;
  });
  const assembly = groups.length + 2;
  const model = `<?xml version="1.0" encoding="UTF-8"?>
<model unit="millimeter" xml:lang="ja-JP" xmlns="http://schemas.microsoft.com/3dmanufacturing/core/2015/02">
<metadata name="Title">合書 gassho</metadata>
<resources>
<basematerials id="1">${groups.map(g => `<base name="${g.label}" displaycolor="${(g.col || "#ffffff").toUpperCase()}FF"/>`).join("")}</basematerials>
${objs}
<object id="${assembly}" name="合書" type="model"><components>${groups.map((_, gi) => `<component objectid="${gi + 2}"/>`).join("")}</components></object>
</resources>
<build><item objectid="${assembly}"/></build>
</model>`;
  const enc = new TextEncoder();
  const blob = zipStore([
    { name: "[Content_Types].xml", data: enc.encode(`<?xml version="1.0" encoding="UTF-8"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="model" ContentType="application/vnd.ms-package.3dmanufacturing-3dmodel+xml"/></Types>`) },
    { name: "_rels/.rels", data: enc.encode(`<?xml version="1.0" encoding="UTF-8"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Target="/3D/3dmodel.model" Id="rel0" Type="http://schemas.microsoft.com/3dmanufacturing/2013/01/3dmodel"/></Relationships>`) },
    { name: "3D/3dmodel.model", data: enc.encode(model) },
  ]);
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "gassho-" + new Date().toISOString().slice(0, 19).replace(/[:T]/g, "-") + ".3mf";

$("save").onclick = () => export3MF();
