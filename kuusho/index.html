<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kuusho 空書 – 体で書道</title>
<style>
  :root { --bg:#0e0d0c; --panel:rgba(22,20,18,.84); --fg:#efe9df; --mute:#9a9286; --acc:#d63a24; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg); overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif; }
  #stage { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  #cv { max-width:100%; max-height:100%; }
  #gl { position:fixed; inset:0; width:100%; height:100%; touch-action:none; }
  video { display:none; }
  #start { position:fixed; inset:0; display:flex; flex-direction:column; gap:16px;
    align-items:center; justify-content:center; text-align:center; padding:24px; z-index:6; background:var(--bg); }
  #start h1 { margin:0; font-size:44px; font-weight:600; letter-spacing:.2em; }
  #start h1 small { display:block; font-size:14px; letter-spacing:.3em; color:var(--mute); font-weight:400; margin-top:4px; }
  #start p { margin:0; color:var(--mute); line-height:1.9; max-width:440px; font-size:14px; }
  #start .how { color:var(--fg); font-size:15px; }
  .ui, button, select { font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif; }
  button, select { font-size:14px; color:var(--fg); background:#2a2622; border:1px solid #403a33; border-radius:10px; padding:9px 13px; }
  button.primary { background:var(--acc); color:#fff; border:none; font-weight:700; padding:11px 22px; letter-spacing:.08em; }
  #go { padding:13px 30px; font-size:17px; }
  button:active { transform:scale(.97); }
  button:disabled { opacity:.5; }
  .bar { position:fixed; left:50%; bottom:max(14px, env(safe-area-inset-bottom)); transform:translateX(-50%);
    display:flex; flex-wrap:wrap; gap:8px; align-items:center; justify-content:center;
    background:var(--panel); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    padding:10px 12px; border-radius:16px; width:min(96vw, 780px); z-index:4; }
  .bar label { display:flex; align-items:center; gap:6px; color:var(--mute); font-size:13px; }
  .bar input[type=range] { width:90px; accent-color:var(--acc); }
  #status { position:fixed; top:max(10px, env(safe-area-inset-top)); left:12px; font-size:12px;
    color:var(--mute); background:var(--panel); padding:5px 9px; border-radius:8px; z-index:4; }
  #timer { position:fixed; top:max(14px, env(safe-area-inset-top)); left:50%; transform:translateX(-50%);
    font-size:40px; font-weight:600; letter-spacing:.05em; z-index:5; text-shadow:0 2px 12px rgba(0,0,0,.6);
    pointer-events:none; }
  #timer.big { top:50%; transform:translate(-50%,-50%); font-size:120px; }
  #hint { position:fixed; top:max(64px, calc(env(safe-area-inset-top) + 54px)); left:50%; transform:translateX(-50%);
    font-size:13px; color:var(--mute); background:var(--panel); padding:6px 12px; border-radius:10px; z-index:4; white-space:nowrap; }
  .hidden { display:none !important; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="start">
  <h1>空書<small>KUUSHO</small></h1>
  <p class="how">五本の指先が、そのまま筆になる。<br>指を広げると太く、すぼめると細く。<br>速く払えばかすれ、ゆっくり留めればにじむ。<br>十五秒で書き、書いた線を立体で眺める。</p>
  <p>映像は端末の中だけで処理され、どこにも送信されません。</p>
  <button class="primary" id="go">筆をとる</button>
  <p id="err" class="ui" style="color:#fca5a5"></p>
</div>

<div id="stage"><canvas id="cv"></canvas></div>
<canvas id="gl" class="hidden"></canvas>
<video id="video" playsinline muted></video>
<div id="status" class="ui hidden">読み込み中…</div>
<div id="timer" class="hidden"></div>
<div id="hint" class="ui hidden">ドラッグで回転・ピンチで拡大</div>

<div id="barCam" class="bar ui hidden">
  <select id="ink" title="墨の色">
    <option value="244,238,226">白墨</option>
    <option value="18,16,14">墨</option>
    <option value="214,58,36">朱</option>
    <option value="212,172,70">金</option>
    <option value="52,86,170">藍</option>
  </select>
  <label><input id="showVideo" type="checkbox" checked> 映像</label>
  <label><input id="showSkel" type="checkbox"> 骨格</label>
  <button id="flip">🔄 カメラ切替</button>
  <button id="rec" class="primary">書き始める（15秒）</button>
</div>

<div id="barView" class="bar ui hidden">
  <select id="ink3" title="墨の色">
    <option value="244,238,226">白墨</option>
    <option value="18,16,14">墨</option>
    <option value="214,58,36">朱</option>
    <option value="212,172,70">金</option>
    <option value="52,86,170">藍</option>
  </select>
  <label>奥行き <input id="depth" type="range" min="0" max="40" value="15"></label>
  <label><input id="autoRot" type="checkbox" checked> 自動回転</label>
  <button id="front">正面</button>
  <button id="save">📷 保存</button>
  <button id="again" class="primary">もう一度書く</button>
</div>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { FilesetResolver, HandLandmarker } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

const $ = id => document.getElementById(id);
const video = $("video"), cv = $("cv"), ctx = cv.getContext("2d");
const statusEl = $("status"), timerEl = $("timer");
const CONNECTIONS = HandLandmarker.HAND_CONNECTIONS;
const TIPS = [4, 8, 12, 16, 20];            // thumb → pinky: the edge of the brush
const HAIRS = 44;                            // hairs across the brush
const REC_SEC = 15;

let landmarker = null, stream = null, facing = "user", lastVideoTime = -1;
let mode = "idle";                           // idle | ready | count | rec | view
let modeT0 = 0;
let lastHands = [];
const ink = document.createElement("canvas"), ictx = ink.getContext("2d");
const live = new Map();                      // per-hand state while writing
let strokes = [];                            // recorded strokes for 3D

const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const lerpPts = (A, B, t) => A.map((p, i) => p.map((v, k) => v + (B[i][k] - v) * t));
function along(pts, s) {                     // point at s∈[0,1] on the polyline through the fingertips
  const f = s * (pts.length - 1), i = Math.min(pts.length - 2, Math.floor(f)), t = f - i;
  return pts[i].map((v, k) => v + (pts[i + 1][k] - v) * t);
}
const polyLen = pts => pts.slice(1).reduce((s, p, i) => s + Math.hypot(...p.map((v, k) => v - pts[i][k])), 0);
const centroid = pts => pts[0].map((_, k) => pts.reduce((s, p) => s + p[k], 0) / pts.length);

// ---------- model & camera ----------
async function loadModel() {
  const fs = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
  const opts = (delegate) => ({
    baseOptions: { modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task", delegate },
    runningMode: "VIDEO", numHands: 2, minHandDetectionConfidence: 0.5, minTrackingConfidence: 0.5,
  });
  try { landmarker = await HandLandmarker.createFromOptions(fs, opts("GPU")); }
  catch { landmarker = await HandLandmarker.createFromOptions(fs, opts("CPU")); }
}
async function startCamera() {
  stopCamera();
  stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: facing, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false });
  video.srcObject = stream;
  await video.play();
  cv.width = ink.width = video.videoWidth; cv.height = ink.height = video.videoHeight;
  lastVideoTime = -1;
}
function stopCamera() { if (stream) stream.getTracks().forEach(t => t.stop()); stream = null; }

function setMode(m) {
  mode = m; modeT0 = performance.now();
  const view = m === "view";
  $("stage").classList.toggle("hidden", view);
  $("gl").classList.toggle("hidden", !view);
  $("hint").classList.toggle("hidden", !view);
  $("barView").classList.toggle("hidden", !view);
  $("barCam").classList.toggle("hidden", view);
  statusEl.classList.toggle("hidden", view);
  timerEl.classList.toggle("hidden", !(m === "count" || m === "rec"));
  timerEl.classList.toggle("big", m === "count");
  for (const id of ["rec", "flip"]) $(id).disabled = m === "count" || m === "rec";
}

$("go").onclick = async () => {
  $("err").textContent = "";
  $("go").disabled = true; $("go").textContent = "準備中…";
  try {
    statusEl.classList.remove("hidden");
    await Promise.all([loadModel(), startCamera()]);
    $("start").classList.add("hidden");
    setMode("ready");
    requestAnimationFrame(loop);
  } catch (e) {
    console.error(e);
    $("err").textContent = "起動できませんでした：" + (e.name === "NotAllowedError" ? "カメラの使用を許可してください。" : e.message);
    $("go").disabled = false; $("go").textContent = "もう一度試す";
  }
};
$("flip").onclick = async () => {
  facing = facing === "user" ? "environment" : "user";
  try { await startCamera(); } catch { facing = facing === "user" ? "environment" : "user"; await startCamera(); }
};
$("rec").onclick = () => {
  ictx.clearRect(0, 0, ink.width, ink.height);
  live.clear(); strokes = [];
  setMode("count");
};
$("again").onclick = async () => {
  clearScene();
  setMode("ready");
  try { await startCamera(); requestAnimationFrame(loop); }
  catch (e) { statusEl.textContent = "カメラを起動できませんでした"; }
};

// ---------- reading the hand ----------
function readHand(lm, W, H, mirror, prevDepth) {
  const P = i => [(mirror ? 1 - lm[i].x : lm[i].x) * W, lm[i].y * H];
  const tips2 = TIPS.map(P);
  const [wx, wy] = P(0), [mx, my] = P(9);
  const handSize = Math.max(4, Math.hypot(mx - wx, my - wy)) / H;   // apparent size → distance
  const raw = 0.2 / handSize;
  const d = prevDepth == null ? raw : prevDepth * 0.8 + raw * 0.2;
  const tips3 = TIPS.map((i, n) => {
    const [px, py] = tips2[n];
    return [(px - W / 2) / H * d, -(py - H / 2) / H * d, -(d + lm[i].z * (W / H) * d)];
  });
  return { tips2, tips3, d };
}

function updateHand(key, h, now) {
  let s = live.get(key);
  if (!s || now - s.t > 250) {               // hand (re)appeared → new stroke
    s = { t: now, d: h.d, v: 0, tips2: h.tips2, tips3: h.tips3, hairs: newHairs(), stroke: null };
    if (mode === "rec") { s.stroke = { samples: [], seed: Math.random() * 1000 }; strokes.push(s.stroke); }
    live.set(key, s);
    record(s, 0, 0, now);
    return;
  }
  const dt = Math.max(1, now - s.t);
  const tips2 = lerpPts(s.tips2, h.tips2, 0.6);
  const tips3 = lerpPts(s.tips3, h.tips3, 0.6);
  const c0 = centroid(s.tips2), c1 = centroid(tips2);
  const v = Math.hypot(c1[0] - c0[0], c1[1] - c0[1]) / cv.width / (dt / 1000);
  s.v = s.v * 0.6 + v * 0.4;
  const dry = smooth(0.3, 1.4, s.v);         // fast → kasure
  const wet = 1 - smooth(0.03, 0.28, s.v);   // slow → nijimi
  if (mode === "rec") paint2D(s, s.tips2, tips2, dry, wet);
  Object.assign(s, { t: now, d: h.d, tips2, tips3 });
  record(s, dry, wet, now);
}
function record(s, dry, wet, now) {
  if (mode === "rec" && s.stroke) s.stroke.samples.push({ p: s.tips3.map(p => p.slice()), dry, wet });
}
function newHairs() { return Array.from({ length: HAIRS }, () => 0.3 + Math.random() * 0.7); }

// ---------- 2D ink while writing ----------
function paint2D(s, A, B, dry, wet) {
  const col = $("ink").value, g = ictx;
  const span = polyLen(B);
  g.lineCap = dry > 0.4 ? "butt" : "round";
  g.lineWidth = Math.max(1.2, span / HAIRS * (dry > 0.4 ? 1.5 : 2.6));
  for (let i = 0; i < HAIRS; i++) {
    const u = (i + 0.5) / HAIRS;
    const inkAmt = s.hairs[i] * (1 - 0.45 * Math.abs(u * 2 - 1)) + (Math.random() - 0.5) * 0.1;
    if (inkAmt < dry * 0.9) continue;
    const a = (0.5 + 0.45 * Math.min(1, inkAmt)) * (1 - 0.35 * dry);
    const p = along(A, u), q = along(B, u);
    g.strokeStyle = `rgba(${col},${a.toFixed(3)})`;
    g.beginPath(); g.moveTo(p[0], p[1]); g.lineTo(q[0], q[1]); g.stroke();
  }
  if (wet > 0.03) {
    const r = (span / 8 + 5) * (1 + 1.2 * wet);
    for (const t of B) blot(g, col, t[0] + (Math.random() - .5) * r * .6, t[1] + (Math.random() - .5) * r * .6, r, 0.07 * wet);
  }
}
function blot(g, col, x, y, r, a) {
  const gr = g.createRadialGradient(x, y, 0, x, y, r);
  gr.addColorStop(0, `rgba(${col},${a})`);
  gr.addColorStop(0.55, `rgba(${col},${a * 0.6})`);
  gr.addColorStop(1, `rgba(${col},0)`);
  g.fillStyle = gr; g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
}

// ---------- camera-phase render loop ----------
function compose(now) {
  const W = cv.width, H = cv.height, mirror = facing === "user", sc = W / 1280;
  ctx.fillStyle = "#0e0d0c"; ctx.fillRect(0, 0, W, H);
  if ($("showVideo").checked) {
    ctx.save();
    if (mirror) { ctx.translate(W, 0); ctx.scale(-1, 1); }
    ctx.drawImage(video, 0, 0, W, H);
    ctx.restore();
  }
  ctx.drawImage(ink, 0, 0);
  if ($("showSkel").checked) {
    ctx.strokeStyle = "rgba(255,255,255,.6)"; ctx.lineWidth = 2 * sc; ctx.fillStyle = "#fff";
    for (const lm of lastHands) {
      const P = p => [(mirror ? 1 - p.x : p.x) * W, p.y * H];
      for (const c of CONNECTIONS) {
        const [x1, y1] = P(lm[c.start]), [x2, y2] = P(lm[c.end]);
        ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
      }
    }
  }
  // the brush edge: a line through the five fingertips
  for (const s of live.values()) {
    if (now - s.t > 120) continue;
    ctx.strokeStyle = "rgba(255,255,255,.55)"; ctx.lineWidth = 1.5 * sc;
    ctx.beginPath(); s.tips2.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.stroke();
    ctx.fillStyle = "rgba(255,255,255,.85)";
    for (const p of s.tips2) { ctx.beginPath(); ctx.arc(p[0], p[1], 3.5 * sc, 0, 7); ctx.fill(); }
  }
}

function loop() {
  if (mode === "view" || mode === "idle") return;
  const now = performance.now();
  if (mode === "count") {
    const left = 3 - Math.floor((now - modeT0) / 1000);
    timerEl.textContent = left;
    if (left <= 0) { live.clear(); setMode("rec"); }
  } else if (mode === "rec") {
    const left = Math.max(0, REC_SEC - (now - modeT0) / 1000);
    timerEl.textContent = left.toFixed(0);
    if (left <= 0) { finish(); return; }
  }
  if (landmarker && video.readyState >= 2 && video.currentTime !== lastVideoTime) {
    lastVideoTime = video.currentTime;
    const res = landmarker.detectForVideo(video, now);
    lastHands = res.landmarks || [];
    const mirror = facing === "user";
    lastHands.forEach((lm, i) => {
      const key = res.handedness?.[i]?.[0]?.categoryName || ("H" + i);
      updateHand(key, readHand(lm, cv.width, cv.height, mirror, live.get(key)?.d), now);
    });
    statusEl.textContent = mode === "rec" ? "書いています" :
      lastHands.length ? "準備OK：「書き始める」を押してください" : "手を映してください";
  }
  compose(now);
  requestAnimationFrame(loop);
}

// ---------- 3D viewer ----------
let renderer, scene, camera3, controls, group, colorU = { value: new THREE.Color() }, pointScale = { value: 1 };
let viewSpan = 1;

function initThree() {
  if (renderer) return;
  renderer = new THREE.WebGLRenderer({ canvas: $("gl"), antialias: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(Math.min(2, devicePixelRatio));
  scene = new THREE.Scene();
  camera3 = new THREE.PerspectiveCamera(45, 1, 0.01, 100);
  controls = new OrbitControls(camera3, renderer.domElement);
  controls.enableDamping = true; controls.autoRotateSpeed = 1.6;
  group = new THREE.Group(); scene.add(group);
  addEventListener("resize", resize3);
  renderer.setAnimationLoop(() => {
    if (mode !== "view") return;
    controls.autoRotate = $("autoRot").checked;
    controls.update();
    renderer.render(scene, camera3);
  });
}
function resize3() {
  if (!renderer) return;
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  camera3.aspect = w / h; camera3.updateProjectionMatrix();
  pointScale.value = h * renderer.getPixelRatio() / (2 * Math.tan(THREE.MathUtils.degToRad(camera3.fov) / 2));
}
function applyColor() {
  const [r, g, b] = $("ink3").value.split(",").map(v => +v / 255);
  colorU.value.setRGB(r, g, b);   // raw values: the shaders write them straight out
  const lum = 0.3 * r + 0.59 * g + 0.11 * b;
  scene.background = new THREE.Color(lum < 0.35 ? 0xefe9df : 0x0e0d0c);
}
$("ink3").onchange = () => { $("ink").value = $("ink3").value; applyColor(); };
$("depth").oninput = () => { if (group) group.scale.z = +$("depth").value / 10; };
$("front").onclick = () => frontView();

const ribbonVS = `
  attribute float aDry;
  varying vec2 vUv; varying float vDry;
  void main(){ vUv = uv; vDry = aDry; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`;
const ribbonFS = `
  uniform vec3 uColor; uniform float uSeed;
  varying vec2 vUv; varying float vDry;
  float h1(float n){ return fract(sin(n * 12.9898 + uSeed) * 43758.5453); }
  float h2(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233)) + uSeed) * 43758.5453); }
  void main(){
    float hair = floor(vUv.x * ${HAIRS}.0);
    float load = 0.3 + 0.7 * h1(hair);
    float inkAmt = load * (1.0 - 0.45 * abs(vUv.x * 2.0 - 1.0)) + (h2(vec2(hair, floor(vUv.y * 90.0))) - 0.5) * 0.1;
    if (inkAmt < vDry * 0.9) discard;
    float a = (0.55 + 0.4 * min(1.0, inkAmt)) * (1.0 - 0.35 * vDry);
    gl_FragColor = vec4(uColor, a);
  }`;
const blotVS = `
  attribute float aSize; attribute float aAlpha; uniform float uScale; varying float vA;
  void main(){ vec4 mv = modelViewMatrix * vec4(position,1.0); vA = aAlpha;
    gl_PointSize = aSize * uScale / -mv.z; gl_Position = projectionMatrix * mv; }`;
const blotFS = `
  uniform vec3 uColor; varying float vA;
  void main(){ float d = length(gl_PointCoord - 0.5) * 2.0; if (d > 1.0) discard;
    float f = 1.0 - smoothstep(0.0, 1.0, d); gl_FragColor = vec4(uColor, vA * f * f); }`;

function clearScene() {
  if (!group) return;
  for (const o of [...group.children]) { o.geometry.dispose(); o.material.dispose(); group.remove(o); }
}

function finish() {
  stopCamera();
  const usable = strokes.filter(s => s.samples.length >= 2);
  if (!usable.length) {
    setMode("ready"); statusEl.textContent = "線が書けていませんでした。もう一度どうぞ";
    startCamera().then(() => requestAnimationFrame(loop));
    return;
  }
  initThree(); clearScene();
  $("ink3").value = $("ink").value; applyColor();

  // centre everything so it rotates around the middle of the writing
  const all = usable.flatMap(s => s.samples.flatMap(x => x.p));
  const min = [0, 1, 2].map(k => Math.min(...all.map(p => p[k])));
  const max = [0, 1, 2].map(k => Math.max(...all.map(p => p[k])));
  const ctr = min.map((v, k) => (v + max[k]) / 2);
  viewSpan = Math.max(max[0] - min[0], max[1] - min[1], 0.2);

  const M = 9;                                 // vertices across the brush
  for (const st of usable) {
    const S = st.samples, n = S.length;
    const pos = new Float32Array(n * M * 3), uv = new Float32Array(n * M * 2), dry = new Float32Array(n * M);
    let vlen = 0;
    for (let i = 0; i < n; i++) {
      if (i) { const a = centroid(S[i].p), b = centroid(S[i - 1].p); vlen += Math.hypot(a[0] - b[0], a[1] - b[1], a[2] - b[2]); }
      for (let j = 0; j < M; j++) {
        const u = j / (M - 1), p = along(S[i].p, u), o = i * M + j;
        pos.set([p[0] - ctr[0], p[1] - ctr[1], p[2] - ctr[2]], o * 3);
        uv.set([u, vlen], o * 2);
        dry[o] = S[i].dry;
      }
    }
    const idx = [];
    for (let i = 0; i < n - 1; i++) for (let j = 0; j < M - 1; j++) {
      const a = i * M + j, b = a + 1, c = a + M, d = c + 1;
      idx.push(a, c, b, b, c, d);
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
    geo.setAttribute("uv", new THREE.BufferAttribute(uv, 2));
    geo.setAttribute("aDry", new THREE.BufferAttribute(dry, 1));
    geo.setIndex(idx);
    const mat = new THREE.ShaderMaterial({
      vertexShader: ribbonVS, fragmentShader: ribbonFS,
      uniforms: { uColor: colorU, uSeed: { value: st.seed } },
      transparent: true, side: THREE.DoubleSide, depthWrite: false,
    });
    group.add(new THREE.Mesh(geo, mat));

    // nijimi: soft blots where the brush lingered
    const bp = [], bs = [], ba = [];
    S.forEach((x, i) => {
      if (x.wet < 0.08 || i % 2) return;
      const span = polyLen(x.p);
      for (const t of x.p) {
        bp.push(t[0] - ctr[0], t[1] - ctr[1], t[2] - ctr[2]);
        bs.push((span / 4 + 0.015) * (1 + 1.2 * x.wet) * 2);
        ba.push(0.16 * x.wet);
      }
    });
    if (bp.length) {
      const pg = new THREE.BufferGeometry();
      pg.setAttribute("position", new THREE.Float32BufferAttribute(bp, 3));
      pg.setAttribute("aSize", new THREE.Float32BufferAttribute(bs, 1));
      pg.setAttribute("aAlpha", new THREE.Float32BufferAttribute(ba, 1));
      const pm = new THREE.ShaderMaterial({
        vertexShader: blotVS, fragmentShader: blotFS,
        uniforms: { uColor: colorU, uScale: pointScale }, transparent: true, depthWrite: false,
      });
      group.add(new THREE.Points(pg, pm));
    }
  }
  group.scale.z = +$("depth").value / 10;
  setMode("view");
  resize3();
  frontView();
}
function frontView() {
  controls.target.set(0, 0, 0);
  const dist = viewSpan / (2 * Math.tan(THREE.MathUtils.degToRad(camera3.fov) / 2)) * 1.35 / Math.min(1, camera3.aspect);
  camera3.position.set(0, 0, dist);
  controls.update();
}

$("save").onclick = () => {
  renderer.render(scene, camera3);
  renderer.domElement.toBlob(b => {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(b);
    a.download = "kuusho-3d-" + new Date().toISOString().replace(/[:.]/g, "-") + ".png";
    a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  }, "image/png");
};
</script>
