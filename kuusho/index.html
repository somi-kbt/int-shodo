<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kuusho 空書 – 体で書道</title>
<style>
  :root { --bg:#0b0d12; --panel:rgba(20,23,31,.82); --fg:#e9ecf3; --mute:#8a93a6; --acc:#5eead4; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif; }
  #stage { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  canvas { max-width:100%; max-height:100%; }
  video { display:none; }
  #start { position:fixed; inset:0; display:flex; flex-direction:column; gap:14px;
    align-items:center; justify-content:center; text-align:center; padding:24px; z-index:5; background:var(--bg); }
  #start h1 { margin:0; font-size:26px; letter-spacing:.02em; }
  #start p { margin:0; color:var(--mute); line-height:1.7; max-width:420px; }
  button, select { font:inherit; color:var(--fg); background:#232838; border:1px solid #343b50;
    border-radius:10px; padding:9px 13px; }
  button.primary { background:var(--acc); color:#06231f; border:none; font-weight:700; padding:13px 26px; font-size:17px; }
  button:active { transform:scale(.97); }
  #bar { position:fixed; left:50%; bottom:max(14px, env(safe-area-inset-bottom)); transform:translateX(-50%);
    display:flex; flex-wrap:wrap; gap:8px; align-items:center; justify-content:center;
    background:var(--panel); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    padding:10px 12px; border-radius:16px; width:min(96vw, 760px); z-index:4; }
  #bar label { display:flex; align-items:center; gap:6px; color:var(--mute); font-size:13px; }
  #bar input[type=range] { width:90px; accent-color:var(--acc); }
  #status { position:fixed; top:max(10px, env(safe-area-inset-top)); left:12px; font-size:12px;
    color:var(--mute); background:var(--panel); padding:5px 9px; border-radius:8px; z-index:4; }
  .hidden { display:none !important; }
</style>
</head>
<body>
<div id="start">
  <h1>kuusho <span style="font-weight:400;opacity:.7">空書</span></h1>
  <p>カメラに映った人の手を検出して、動きの軌跡を描きます。<br>映像は端末内だけで処理され、どこにも送信されません。</p>
  <button class="primary" id="go">カメラを起動</button>
  <p id="err" style="color:#fca5a5"></p>
</div>

<div id="stage"><canvas id="cv"></canvas></div>
<video id="video" playsinline muted></video>
<div id="status" class="hidden">読み込み中…</div>

<div id="bar" class="hidden">
  <select id="point" title="追跡する点">
    <option value="8">人差し指の先</option>
    <option value="tips">全部の指先</option>
    <option value="9">手のひら中心</option>
    <option value="0">手首</option>
  </select>
  <label>残る長さ <input id="life" type="range" min="1" max="21" value="4"><span id="lifeTxt">4秒</span></label>
  <label>太さ <input id="width" type="range" min="2" max="24" value="7"></label>
  <label><input id="showVideo" type="checkbox" checked> 映像</label>
  <label><input id="showSkel" type="checkbox"> 骨格</label>
  <button id="flip">🔄 カメラ切替</button>
  <button id="clear">消去</button>
  <button id="save">📷 保存</button>
</div>

<script type="module">
import { FilesetResolver, HandLandmarker } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

const $ = id => document.getElementById(id);
const video = $("video"), cv = $("cv"), ctx = cv.getContext("2d");
const statusEl = $("status");
let landmarker = null, stream = null, facing = "user", lastVideoTime = -1;
// trails: key -> array of segments; segment = array of {x,y,t}
const trails = new Map();
const lastSeen = new Map();
const COLORS = ["#5eead4","#f472b6","#facc15","#60a5fa","#fb923c","#a78bfa","#4ade80","#f87171","#22d3ee","#e879f9"];
const CONNECTIONS = HandLandmarker.HAND_CONNECTIONS;

const lifeSec = () => { const v = +$("life").value; return v > 20 ? Infinity : v; };
$("life").oninput = () => { $("lifeTxt").textContent = lifeSec() === Infinity ? "∞" : lifeSec() + "秒"; };

async function loadModel() {
  const fs = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
  const opts = (delegate) => ({
    baseOptions: { modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task", delegate },
    runningMode: "VIDEO", numHands: 2,
    minHandDetectionConfidence: 0.5, minTrackingConfidence: 0.5,
  });
  try { landmarker = await HandLandmarker.createFromOptions(fs, opts("GPU")); }
  catch { landmarker = await HandLandmarker.createFromOptions(fs, opts("CPU")); }
}

async function startCamera() {
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: facing, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false });
  video.srcObject = stream;
  await video.play();
  cv.width = video.videoWidth; cv.height = video.videoHeight;
  lastVideoTime = -1;
}

$("go").onclick = async () => {
  $("err").textContent = "";
  $("go").disabled = true; $("go").textContent = "準備中…";
  try {
    statusEl.classList.remove("hidden");
    await Promise.all([loadModel(), startCamera()]);
    $("start").classList.add("hidden");
    $("bar").classList.remove("hidden");
    statusEl.textContent = "手を映してください";
    requestAnimationFrame(loop);
  } catch (e) {
    console.error(e);
    $("err").textContent = "起動できませんでした：" + (e.name === "NotAllowedError" ? "カメラの使用を許可してください。" : e.message);
    $("go").disabled = false; $("go").textContent = "もう一度試す";
  }
};

$("flip").onclick = async () => {
  facing = facing === "user" ? "environment" : "user";
  trails.clear();
  try { await startCamera(); } catch (e) { facing = facing === "user" ? "environment" : "user"; await startCamera(); }
};
$("clear").onclick = () => trails.clear();
$("point").onchange = () => trails.clear();

$("save").onclick = () => {
  cv.toBlob(b => {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(b);
    a.download = "kuusho-" + new Date().toISOString().replace(/[:.]/g, "-") + ".png";
    a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  }, "image/png");
};

function addPoint(key, x, y, t) {
  let segs = trails.get(key);
  if (!segs) { segs = [[]]; trails.set(key, segs); }
  const gap = t - (lastSeen.get(key) ?? -1e9);
  if (gap > 250 && segs[segs.length - 1].length) segs.push([]);
  const seg = segs[segs.length - 1];
  const prev = seg[seg.length - 1];
  // light smoothing to reduce jitter
  if (prev) { x = prev.x * 0.35 + x * 0.65; y = prev.y * 0.35 + y * 0.65; }
  seg.push({ x, y, t });
  lastSeen.set(key, t);
}

function prune(now) {
  const life = lifeSec() * 1000;
  if (life === Infinity) return;
  for (const [k, segs] of trails) {
    for (const s of segs) while (s.length && now - s[0].t > life) s.shift();
    const kept = segs.filter((s, i) => s.length || i === segs.length - 1);
    if (!kept.some(s => s.length) && now - (lastSeen.get(k) ?? 0) > life) trails.delete(k);
    else trails.set(k, kept);
  }
}

function drawTrails(now) {
  const life = lifeSec() * 1000, w = +$("width").value * (cv.width / 1280);
  ctx.lineCap = "round"; ctx.lineJoin = "round";
  for (const [key, segs] of trails) {
    const color = COLORS[hashKey(key) % COLORS.length];
    for (const s of segs) {
      for (let i = 1; i < s.length; i++) {
        const a = s[i - 1], b = s[i];
        const age = life === Infinity ? 0 : (now - b.t) / life;
        const alpha = Math.max(0, 1 - age);
        ctx.strokeStyle = color; ctx.globalAlpha = alpha;
        ctx.lineWidth = Math.max(1, w * (0.35 + 0.65 * alpha));
        ctx.shadowColor = color; ctx.shadowBlur = w * 1.6;
        ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
      }
    }
  }
  ctx.globalAlpha = 1; ctx.shadowBlur = 0;
}
function hashKey(k) { let h = 0; for (const c of k) h = (h * 31 + c.charCodeAt(0)) >>> 0; return h; }

function loop() {
  const now = performance.now();
  const W = cv.width, H = cv.height, mirror = facing === "user";
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = "#0b0d12"; ctx.fillRect(0, 0, W, H);
  if ($("showVideo").checked) {
    ctx.save();
    if (mirror) { ctx.translate(W, 0); ctx.scale(-1, 1); }
    ctx.drawImage(video, 0, 0, W, H);
    ctx.restore();
  }

  let result = null;
  if (landmarker && video.readyState >= 2 && video.currentTime !== lastVideoTime) {
    lastVideoTime = video.currentTime;
    result = landmarker.detectForVideo(video, now);
    const sel = $("point").value;
    const idxs = sel === "tips" ? [4, 8, 12, 16, 20] : [+sel];
    const hands = result.landmarks || [];
    hands.forEach((lm, h) => {
      const side = result.handedness?.[h]?.[0]?.categoryName || ("H" + h);
      idxs.forEach(i => {
        const p = lm[i];
        const x = (mirror ? 1 - p.x : p.x) * W, y = p.y * H;
        addPoint(side + ":" + i, x, y, now);
      });
    });
    statusEl.textContent = hands.length ? `検出中：手 ${hands.length} 本` : "手を映してください";

    if ($("showSkel").checked) {
      ctx.strokeStyle = "rgba(255,255,255,.7)"; ctx.lineWidth = 2 * (W / 1280);
      for (const lm of hands) {
        const P = p => [(mirror ? 1 - p.x : p.x) * W, p.y * H];
        for (const c of CONNECTIONS) {
          const [x1, y1] = P(lm[c.start]), [x2, y2] = P(lm[c.end]);
          ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
        }
        ctx.fillStyle = "#fff";
        for (const p of lm) { const [x, y] = P(p); ctx.beginPath(); ctx.arc(x, y, 3 * (W / 1280), 0, 7); ctx.fill(); }
      }
    }
  }
  prune(now);
  drawTrails(now);
  requestAnimationFrame(loop);
}
</script>
</body>
</html>
