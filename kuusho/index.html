<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="version" content="1.1">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kuusho 空書 – 体で書道 v1.1</title>
<style>
  :root { --bg:#0e0d0c; --panel:rgba(22,20,18,.84); --fg:#efe9df; --mute:#9a9286; --acc:#d63a24; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg); overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif; }
  #stage { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  #cv { max-width:100%; max-height:100%; }
  #gl { position:fixed; inset:0; width:100%; height:100%; touch-action:none; }
  video { display:none; }
  #start { position:fixed; inset:0; display:flex; flex-direction:column; gap:16px;
    align-items:center; justify-content:center; text-align:center; padding:24px; z-index:6; background:var(--bg); }
  #start h1 { margin:0; font-size:44px; font-weight:600; letter-spacing:.2em; }
  #start h1 small { display:block; font-size:14px; letter-spacing:.3em; color:var(--mute); font-weight:400; margin-top:4px; }
  #start p { margin:0; color:var(--mute); line-height:1.9; max-width:440px; font-size:14px; }
  #start .how { color:var(--fg); font-size:15px; }
  .ui, button, select { font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif; }
  button, select { font-size:14px; color:var(--fg); background:#2a2622; border:1px solid #403a33; border-radius:10px; padding:9px 13px; }
  button.primary { background:var(--acc); color:#fff; border:none; font-weight:700; padding:11px 22px; letter-spacing:.08em; }
  #go { padding:13px 30px; font-size:17px; }
  button:active { transform:scale(.97); }
  button:disabled { opacity:.5; }
  .bar { position:fixed; left:50%; bottom:max(14px, env(safe-area-inset-bottom)); transform:translateX(-50%);
    display:flex; flex-wrap:wrap; gap:8px; align-items:center; justify-content:center;
    background:var(--panel); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    padding:10px 12px; border-radius:16px; width:min(96vw, 780px); z-index:4; }
  .bar label { display:flex; align-items:center; gap:6px; color:var(--mute); font-size:13px; }
  .bar input[type=range] { width:90px; accent-color:var(--acc); }
  #status { position:fixed; top:max(10px, env(safe-area-inset-top)); left:12px; font-size:12px;
    color:var(--mute); background:var(--panel); padding:5px 9px; border-radius:8px; z-index:4; }
  #timer { position:fixed; top:max(14px, env(safe-area-inset-top)); left:50%; transform:translateX(-50%);
    font-size:40px; font-weight:600; letter-spacing:.05em; z-index:5; text-shadow:0 2px 12px rgba(0,0,0,.6);
    pointer-events:none; }
  #timer.big { top:50%; transform:translate(-50%,-50%); font-size:120px; }
  #hint { position:fixed; top:max(64px, calc(env(safe-area-inset-top) + 54px)); left:50%; transform:translateX(-50%);
    font-size:13px; color:var(--mute); background:var(--panel); padding:6px 12px; border-radius:10px; z-index:4; white-space:nowrap; }
  #dlg { position:fixed; inset:0; z-index:20; display:flex; align-items:center; justify-content:center; padding:20px;
    background:rgba(0,0,0,.6); }
  #dlg .box { background:#1b1815; border:1px solid #403a33; border-radius:14px; padding:22px 22px 18px;
    max-width:420px; width:100%; text-align:left; box-shadow:0 10px 40px rgba(0,0,0,.5); }
  #dlg h2 { margin:0 0 10px; font-size:18px; }
  #dlg .msg { font-size:14px; line-height:1.8; color:var(--fg); white-space:pre-line; }
  #dlg .detail { font-size:11px; color:var(--mute); margin-top:10px; word-break:break-all; }
  #dlg .btns { display:flex; gap:8px; justify-content:flex-end; margin-top:16px; }
  .hidden { display:none !important; }
</style>
<script async src="https://cdn.jsdelivr.net/npm/es-module-shims@1.10.1/dist/es-module-shims.js"></script>

  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",

<body>
<div id="start">
  <h1>空書<small>KUUSHO</small></h1>
  <p class="how">五本の指先がふちになる、丸い筆。<br>指を広げると太く、すぼめると細く。<br>速く払えばかすれ、ゆっくり留めればにじむ。<br>グーにすると筆が上がる。<br>十五秒で書き、書いた線を立体で眺める。</p>
  <p>スマホでも、PCのWebカメラでも書けます（PCはスペースキーでも書き始められます）。<br>映像は端末の中だけで処理され、どこにも送信されません。</p>
  <button class="primary" id="go">筆をとる</button>
  <p id="err" class="ui" style="color:#fca5a5"></p>
</div>

<div id="dlg" class="ui hidden" role="alertdialog" aria-modal="true" aria-labelledby="dlgTitle">
  <div class="box">
    <h2 id="dlgTitle">カメラを起動できませんでした</h2>
    <div class="msg" id="dlgMsg"></div>
    <div class="detail" id="dlgDetail"></div>
    <div class="btns"><button id="dlgClose">閉じる</button><button id="dlgRetry" class="primary">もう一度ためす</button></div>
  </div>
</div>

<div id="stage"><canvas id="cv"></canvas></div>
<canvas id="gl" class="hidden"></canvas>
<video id="video" playsinline muted></video>
<div id="status" class="ui hidden">読み込み中…</div>
<div id="timer" class="hidden"></div>
<div id="hint" class="ui hidden">ドラッグで回転・ピンチで拡大</div>
<script>if (matchMedia("(pointer: fine)").matches) document.getElementById("hint").textContent = "ドラッグで回転・ホイールで拡大";</script>

<div id="barCam" class="bar ui hidden">
  <select id="ink" title="墨の色">
    <option value="244,238,226">白墨</option>
    <option value="18,16,14">墨</option>
    <option value="214,58,36">朱</option>
    <option value="212,172,70">金</option>
    <option value="52,86,170">藍</option>
  </select>
  <label><input id="showVideo" type="checkbox" checked> 映像</label>
  <label><input id="showSkel" type="checkbox"> 骨格</label>
  <button id="flip">🔄 カメラ切替</button>
  <button id="rec" class="primary">書き始める（15秒）</button>
</div>

<div id="barView" class="bar ui hidden">
  <select id="ink3" title="墨の色">
    <option value="244,238,226">白墨</option>
    <option value="18,16,14">墨</option>
    <option value="214,58,36">朱</option>
    <option value="212,172,70">金</option>
    <option value="52,86,170">藍</option>
  </select>
  <label>奥行き <input id="depth" type="range" min="0" max="40" value="15"></label>
  <label><input id="base" type="checkbox" checked> 台座</label>
  <label><input id="autoRot" type="checkbox" checked> 自動回転</label>
  <button id="front">正面</button>
  <button id="save">🧊 3Dプリント用に保存</button>
  <button id="again" class="primary">もう一度書く</button>
</div>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { FilesetResolver, HandLandmarker } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

window.__kuushoReady = true;
const $ = id => document.getElementById(id);
const video = $("video"), cv = $("cv"), ctx = cv.getContext("2d");
const statusEl = $("status"), timerEl = $("timer");
const CONNECTIONS = HandLandmarker.HAND_CONNECTIONS;
const TIPS = [4, 8, 12, 16, 20];
const FINGERS = [[8, 5], [12, 9], [16, 13], [20, 17]];    // [tip, knuckle] for index..pinky
const HAIRS = 64;                            // hairs in the round brush (2D)
const HAIRS3 = 40;                           // hairs around the tube (3D)
const GAP_MS = 500;                          // tracking may drop out this long without breaking the line
const REC_SEC = 15;

let landmarker = null, stream = null, facing = "user", lastVideoTime = -1;
let mode = "idle";                           // idle | ready | count | rec | view
let modeT0 = 0;
let lastHands = [];
const ink = document.createElement("canvas"), ictx = ink.getContext("2d");
const live = new Map();                      // per-hand state while writing
let strokes = [];                            // recorded strokes for 3D

const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const lerp = (a, b, t) => a.map((v, k) => v + (b[k] - v) * t);
const centroid = pts => pts[0].map((_, k) => pts.reduce((s, p) => s + p[k], 0) / pts.length);
const dist = (a, b) => Math.hypot(...a.map((v, k) => v - b[k]));

// ---------- model & camera ----------
async function loadModel() {
  const fs = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
  const opts = (delegate) => ({
    baseOptions: { modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task", delegate },
    runningMode: "VIDEO", numHands: 2,
    minHandDetectionConfidence: 0.4, minHandPresenceConfidence: 0.3, minTrackingConfidence: 0.3,  // hold on through motion blur
  });
  try { landmarker = await HandLandmarker.createFromOptions(fs, opts("GPU")); }
  catch { landmarker = await HandLandmarker.createFromOptions(fs, opts("CPU")); }
}
async function startCamera() {
  stopCamera();
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    const e = new Error("getUserMedia is not available"); e.name = "NoMediaDevices"; throw e;
  }
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: facing, width: { ideal: 1280 }, height: { ideal: 720 }, frameRate: { ideal: 60 } }, audio: false });
  } catch (e) {
    // some tablets reject the detailed request; try once more with the simplest one
    if (e.name !== "OverconstrainedError" && e.name !== "NotReadableError" && e.name !== "AbortError") throw e;
    stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
  }
  video.srcObject = stream;
  await video.play();
  cv.width = ink.width = video.videoWidth; cv.height = ink.height = video.videoHeight;
  lastVideoTime = -1;
  updateFlip();
}
// PC usually has one webcam: hide the camera-switch button when there is nothing to switch to
async function updateFlip() {
  try {
    const cams = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === "videoinput");
    $("flip").classList.toggle("hidden", cams.length < 2);
  } catch {}
}
function stopCamera() { if (stream) stream.getTracks().forEach(t => t.stop()); stream = null; }

function setMode(m) {
  mode = m; modeT0 = performance.now();
  const view = m === "view";
  $("stage").classList.toggle("hidden", view);
  $("gl").classList.toggle("hidden", !view);
  $("hint").classList.toggle("hidden", !view);
  $("barView").classList.toggle("hidden", !view);
  $("barCam").classList.toggle("hidden", view);
  statusEl.classList.toggle("hidden", view);
  timerEl.classList.toggle("hidden", !(m === "count" || m === "rec"));
  timerEl.classList.toggle("big", m === "count");
  for (const id of ["rec", "flip"]) $(id).disabled = m === "count" || m === "rec";
}

// ---- error dialog: tell people why it didn't start and how to fix it ----
const isApple = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const isInApp = /Line\/|FBAN|FBAV|Instagram|Twitter|MicroMessenger/i.test(navigator.userAgent);
function cameraHelp(e) {
  const howToAllow = isApple
    ? "【iPad / iPhone】\nアドレスバーの「ぁあ」（または「AA」）→「Webサイトの設定」→「カメラ」を「許可」にして、ページを再読み込みしてください。\nそれでもだめなら「設定」アプリ →「アプリ」→「Safari」→「カメラ」を「確認」か「許可」に。"
    : "【Android / Chrome】\nアドレスバー左のマーク →「権限」（またはサイトの設定）→「カメラ」を「許可」にして、ページを再読み込みしてください。\nそれでもだめなら端末の「設定」→「アプリ」→「Chrome」→「権限」→「カメラ」を許可に。";
  if (e.name === "NoMediaDevices" || isInApp && e.name !== "NotAllowedError")
    return "このブラウザではカメラが使えません。\nLINEなどのアプリの中で開いている場合は、右上のメニューから「Safariで開く」「ブラウザで開く」を選んでください。";
  if (e.name === "NotAllowedError" || e.name === "SecurityError")
    return "カメラの使用が許可されていません。\n\n" + howToAllow;
  if (e.name === "NotFoundError" || e.name === "OverconstrainedError")
    return "カメラが見つかりませんでした。カメラ付きの端末で開くか、Webカメラをつないでください。";
  if (e.name === "NotReadableError" || e.name === "AbortError")
    return "ほかのアプリやタブがカメラを使っているようです。\nビデオ通話やカメラアプリ、ほかのタブを閉じてから、もう一度ためしてください。";
  return "カメラを起動できませんでした。ページを再読み込みして、もう一度ためしてください。\n\n" + howToAllow;
}
function showStartError(e, retry) {
  $("dlgTitle").textContent = e.isCamera ? "カメラを起動できませんでした" : "読み込みに失敗しました";
  $("dlgMsg").textContent = e.isCamera ? cameraHelp(e)
    : "手の認識の準備ができませんでした。インターネットにつながっているか確かめて、もう一度ためしてください。";
  $("dlgDetail").textContent = (e.name || "Error") + (e.message ? "：" + e.message : "");
  $("dlg").classList.remove("hidden");
  $("dlgRetry").onclick = () => { $("dlg").classList.add("hidden"); retry(); };
}
$("dlgClose").onclick = () => $("dlg").classList.add("hidden");

$("go").onclick = async () => {
  $("err").textContent = "";
  $("go").disabled = true; $("go").textContent = "準備中…";
  try {
    statusEl.classList.remove("hidden");
    await Promise.all([loadModel(), startCamera().catch(e => { e.isCamera = true; throw e; })]);
    $("start").classList.add("hidden");
    setMode("ready");
    requestAnimationFrame(loop);
  } catch (e) {
    console.error(e);
    stopCamera();
    statusEl.classList.add("hidden");
    $("go").disabled = false; $("go").textContent = "もう一度試す";
    showStartError(e, () => $("go").click());
  }
};
$("flip").onclick = async () => {
  facing = facing === "user" ? "environment" : "user";
  try { await startCamera(); } catch { facing = facing === "user" ? "environment" : "user"; await startCamera(); }
};
// PC: space or Enter starts writing, so both hands can stay up in front of the camera
addEventListener("keydown", e => {
  if ((e.key === " " || e.key === "Enter") && mode === "ready" && !e.target.closest?.("input,select,textarea,button")) { e.preventDefault(); $("rec").click(); }
});
$("rec").onclick = () => {
  ictx.clearRect(0, 0, ink.width, ink.height);
  live.clear(); strokes = [];
  setMode("count");
};
async function backToCamera() {
  clearScene();
  setMode("ready");
  try { await startCamera(); requestAnimationFrame(loop); }
  catch (e) { statusEl.textContent = "カメラを起動できませんでした"; e.isCamera = true; showStartError(e, backToCamera); }
}
$("again").onclick = backToCamera;

// ---------- reading the hand ----------
// Brush = a circle around the five fingertips: centre = their centre, radius = their average distance from it.
function readHand(lm, W, H, mirror, prevDepth) {
  const P = i => [(mirror ? 1 - lm[i].x : lm[i].x) * W, lm[i].y * H];
  const tips2 = TIPS.map(P);
  const c2 = centroid(tips2);
  const handPx = Math.max(4, dist(P(0), P(9)));
  const spread = Math.sqrt(tips2.reduce((s, p) => s + (p[0] - c2[0]) ** 2 + (p[1] - c2[1]) ** 2, 0) / 5);
  // fingertips can't fully touch, so take a little off: pinched fingers → a hairline
  const r2 = Math.max(1, spread - 0.09 * handPx);

  // distance from camera, estimated from how big the hand looks
  const handSize = handPx / H;
  const raw = 0.2 / handSize;
  const d = prevDepth == null ? raw : prevDepth * 0.8 + raw * 0.2;
  const zRel = TIPS.reduce((s, i) => s + lm[i].z, 0) / 5;
  const c3 = [(c2[0] - W / 2) / H * d, -(c2[1] - H / 2) / H * d, -(d + zRel * (W / H) * d)];
  const r3 = r2 / H * d;

  // fist: fingertips folded back into the palm (closer to the wrist than barely past the knuckles).
  // Pinched fingers keep their tips well beyond the knuckles, so they still count as writing.
  const L = i => [lm[i].x, lm[i].y, lm[i].z];
  const curled = FINGERS.filter(([t, k]) => dist(L(t), L(0)) < dist(L(k), L(0)) * 1.15).length;
  return { tips2, c2, r2, c3, r3, d, curled };
}

function updateHand(key, h, now) {
  let s = live.get(key);
  if (!s || now - s.t > GAP_MS) {
    s = { t: now, d: h.d, v: 0, fist: h.curled >= 3, hist: [], stroke: null, hairs: newHairs(),
          c2: h.c2, r2: h.r2, c3: h.c3, r3: h.r3, tips2: h.tips2 };
    live.set(key, s);
  }
  // fist with hysteresis so it doesn't flicker
  if (h.curled >= 3) s.fist = true; else if (h.curled <= 1) s.fist = false;

  const dt = Math.max(1, now - s.t);
  const c2 = lerp(s.c2, h.c2, 0.7), c3 = lerp(s.c3, h.c3, 0.7);
  const r2 = s.r2 * 0.55 + h.r2 * 0.45, r3 = s.r3 * 0.55 + h.r3 * 0.45;
  const v = dist(c2, s.c2) / cv.width / (dt / 1000);
  s.v = s.v * 0.5 + v * 0.5;
  const dry = 0.85 * smooth(0.4, 1.8, s.v);  // fast → kasure (capped so the core hairs always keep ink and the line never breaks)
  const wet = 1 - smooth(0.03, 0.28, s.v);   // slow → nijimi
  Object.assign(s, { t: now, d: h.d, c2, r2, c3, r3, tips2: h.tips2 });

  if (s.fist || mode !== "rec") { s.stroke = null; s.hist = []; return; }
  if (!s.stroke) { s.stroke = { samples: [], seed: Math.random() * 1000 }; strokes.push(s.stroke); s.hairs = newHairs(); }
  s.hist.push({ c: c2, r: r2 }); if (s.hist.length > 3) s.hist.shift();
  paint2D(s, dry, wet);
  s.stroke.samples.push({ c: c3.slice(), r: r3, dry, wet });
}
function newHairs() {                        // hairs spread over a unit disk
  return Array.from({ length: HAIRS }, () => {
    const rho = Math.sqrt(Math.random()), th = Math.random() * Math.PI * 2;
    return { x: rho * Math.cos(th), y: rho * Math.sin(th), rho, load: 0.3 + Math.random() * 0.7 };
  });
}

// ---------- 2D ink while writing ----------
const mid = (a, b) => ({ c: lerp(a.c, b.c, 0.5), r: (a.r + b.r) / 2 });
function paint2D(s, dry, wet) {
  const H = s.hist, n = H.length, col = $("ink").value, g = ictx;
  if (n < 2) { blot(g, col, H[0].c[0], H[0].c[1], H[0].r * 1.1 + 3, 0.12); return; }
  // smooth curve through the samples: from the previous midpoint to the next, bending at the sample
  const A = n === 2 ? H[0] : mid(H[0], H[1]), C = H[n - 2], B = mid(H[n - 2], H[n - 1]);
  const at = (q, h) => [q.c[0] + h.x * q.r, q.c[1] + h.y * q.r];
  g.lineCap = "round";
  g.lineWidth = Math.max(1, Math.min(2 * C.r, (2 * C.r / Math.sqrt(HAIRS)) * (dry > 0.4 ? 1.4 : 2.2)));
  for (const h of s.hairs) {
    const inkAmt = h.load * (1 - 0.45 * h.rho) + (Math.random() - 0.5) * 0.1;
    if (inkAmt < dry * 0.9) continue;
    const a = (0.5 + 0.45 * Math.min(1, inkAmt)) * (1 - 0.35 * dry);
    const [ax, ay] = at(A, h), [cx, cy] = at(C, h), [bx, by] = at(B, h);
    g.strokeStyle = `rgba(${col},${a.toFixed(3)})`;
    g.beginPath(); g.moveTo(ax, ay); g.quadraticCurveTo(cx, cy, bx, by); g.stroke();
  }
  if (wet > 0.03) {
    const r = B.r * (1 + 1.2 * wet) + 1.5;
    blot(g, col, B.c[0], B.c[1], r, 0.08 * wet);
    for (let i = 0; i < 2; i++) {
      const ang = Math.random() * Math.PI * 2;
      blot(g, col, B.c[0] + Math.cos(ang) * r * 0.7, B.c[1] + Math.sin(ang) * r * 0.7, r * 0.4, 0.06 * wet);
    }
  }
}
function blot(g, col, x, y, r, a) {
  const gr = g.createRadialGradient(x, y, 0, x, y, r);
  gr.addColorStop(0, `rgba(${col},${a})`);
  gr.addColorStop(0.55, `rgba(${col},${a * 0.6})`);
  gr.addColorStop(1, `rgba(${col},0)`);
  g.fillStyle = gr; g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
}

// ---------- camera-phase render loop ----------
function compose(now) {
  const W = cv.width, H = cv.height, mirror = facing === "user", sc = W / 1280;
  ctx.fillStyle = "#0e0d0c"; ctx.fillRect(0, 0, W, H);
  if ($("showVideo").checked) {
    ctx.save();
    if (mirror) { ctx.translate(W, 0); ctx.scale(-1, 1); }
    ctx.drawImage(video, 0, 0, W, H);
    ctx.restore();
  }
  ctx.drawImage(ink, 0, 0);
  if ($("showSkel").checked) {
    ctx.strokeStyle = "rgba(255,255,255,.6)"; ctx.lineWidth = 2 * sc;
    for (const lm of lastHands) {
      const P = p => [(mirror ? 1 - p.x : p.x) * W, p.y * H];
      for (const c of CONNECTIONS) {
        const [x1, y1] = P(lm[c.start]), [x2, y2] = P(lm[c.end]);
        ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
      }
    }
  }
  // the brush: circle through the fingertips (dashed = lifted)
  for (const s of live.values()) {
    if (now - s.t > 150) continue;
    ctx.lineWidth = 1.6 * sc;
    ctx.strokeStyle = s.fist ? "rgba(255,255,255,.35)" : "rgba(255,255,255,.7)";
    ctx.setLineDash(s.fist ? [6 * sc, 6 * sc] : []);
    ctx.beginPath(); ctx.arc(s.c2[0], s.c2[1], s.r2, 0, Math.PI * 2); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = "rgba(255,255,255,.85)";
    for (const p of s.tips2) { ctx.beginPath(); ctx.arc(p[0], p[1], 3 * sc, 0, 7); ctx.fill(); }
  }
}

function loop() {
  if (mode === "view" || mode === "idle") return;
  const now = performance.now();
  if (mode === "count") {
    const left = 3 - Math.floor((now - modeT0) / 1000);
    timerEl.textContent = left;
    if (left <= 0) { live.clear(); setMode("rec"); }
  } else if (mode === "rec") {
    const left = Math.max(0, REC_SEC - (now - modeT0) / 1000);
    timerEl.textContent = left.toFixed(0);
    if (left <= 0) { finish(); return; }
  }
  if (landmarker && video.readyState >= 2 && video.currentTime !== lastVideoTime) {
    lastVideoTime = video.currentTime;
    const res = landmarker.detectForVideo(video, now);
    lastHands = res.landmarks || [];
    const mirror = facing === "user";
    lastHands.forEach((lm, i) => {
      const key = res.handedness?.[i]?.[0]?.categoryName || ("H" + i);
      updateHand(key, readHand(lm, cv.width, cv.height, mirror, live.get(key)?.d), now);
    });
    const anyFist = [...live.values()].some(s => now - s.t < 150 && s.fist);
    statusEl.textContent = mode === "rec" ? (anyFist ? "筆を上げています" : "書いています") :
      lastHands.length ? "準備OK：「書き始める」を押してください" : "手を映してください";
  }
  compose(now);
  requestAnimationFrame(loop);
}

// ---------- 3D viewer ----------
let renderer, scene, camera3, controls, group, colorU = { value: new THREE.Color() }, pointScale = { value: 1 };
let viewSpan = 1;

function initThree() {
  if (renderer) return;
  renderer = new THREE.WebGLRenderer({ canvas: $("gl"), antialias: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(Math.min(2, devicePixelRatio));
  scene = new THREE.Scene();
  camera3 = new THREE.PerspectiveCamera(45, 1, 0.01, 100);
  controls = new OrbitControls(camera3, renderer.domElement);
  controls.enableDamping = true; controls.autoRotateSpeed = 1.6;
  group = new THREE.Group(); scene.add(group);
  addEventListener("resize", resize3);
  renderer.setAnimationLoop(() => {
    if (mode !== "view") return;
    controls.autoRotate = $("autoRot").checked;
    controls.update();
    renderer.render(scene, camera3);
  });
}
function resize3() {
  if (!renderer) return;
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  camera3.aspect = w / h; camera3.updateProjectionMatrix();
  pointScale.value = h * renderer.getPixelRatio() / (2 * Math.tan(THREE.MathUtils.degToRad(camera3.fov) / 2));
}
function applyColor() {
  const [r, g, b] = $("ink3").value.split(",").map(v => +v / 255);
  colorU.value.setRGB(r, g, b);   // raw values: the shaders write them straight out
  const lum = 0.3 * r + 0.59 * g + 0.11 * b;
  scene.background = new THREE.Color(lum < 0.35 ? 0xefe9df : 0x0e0d0c);
}
$("ink3").onchange = () => { $("ink").value = $("ink3").value; applyColor(); };
$("depth").oninput = () => { if (group) group.scale.z = +$("depth").value / 10; };
$("front").onclick = () => frontView();

const tubeVS = `
  attribute float aDry;
  varying vec2 vUv; varying float vDry;
  void main(){ vUv = uv; vDry = aDry; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`;
const tubeFS = `
  uniform vec3 uColor; uniform float uSeed;
  varying vec2 vUv; varying float vDry;
  float h1(float n){ return fract(sin(n * 12.9898 + uSeed) * 43758.5453); }
  float h2(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233)) + uSeed) * 43758.5453); }
  void main(){
    float hair = floor(vUv.x * ${HAIRS3}.0);
    float load = 0.3 + 0.7 * h1(hair);
    float inkAmt = load + (h2(vec2(hair, floor(vUv.y * 90.0))) - 0.5) * 0.1;
    if (inkAmt < vDry * 0.9) discard;
    float a = (0.5 + 0.4 * min(1.0, inkAmt)) * (1.0 - 0.35 * vDry);
    gl_FragColor = vec4(uColor, a);
  }`;
const blotVS = `
  attribute float aSize; attribute float aAlpha; uniform float uScale; varying float vA;
  void main(){ vec4 mv = modelViewMatrix * vec4(position,1.0); vA = aAlpha;
    gl_PointSize = aSize * uScale / -mv.z; gl_Position = projectionMatrix * mv; }`;
const blotFS = `
  uniform vec3 uColor; varying float vA;
  void main(){ float d = length(gl_PointCoord - 0.5) * 2.0; if (d > 1.0) discard;
    float f = 1.0 - smoothstep(0.0, 1.0, d); gl_FragColor = vec4(uColor, vA * f * f); }`;

function clearScene() {
  if (!group) return;
  for (const o of [...group.children]) { o.geometry.dispose(); o.material.dispose(); group.remove(o); }
}

// Catmull-Rom resampling so fast strokes stay smooth curves instead of corners
function resample(S, sub = 3) {
  if (S.length < 3) return S;
  const out = [];
  for (let i = 0; i < S.length - 1; i++) {
    const p0 = S[Math.max(0, i - 1)], p1 = S[i], p2 = S[i + 1], p3 = S[Math.min(S.length - 1, i + 2)];
    for (let k = 0; k < sub; k++) {
      const t = k / sub, t2 = t * t, t3 = t2 * t;
      const c = p1.c.map((_, j) => 0.5 * ((2 * p1.c[j]) + (-p0.c[j] + p2.c[j]) * t +
        (2 * p0.c[j] - 5 * p1.c[j] + 4 * p2.c[j] - p3.c[j]) * t2 + (-p0.c[j] + 3 * p1.c[j] - 3 * p2.c[j] + p3.c[j]) * t3));
      out.push({ c, r: p1.r + (p2.r - p1.r) * t, dry: p1.dry + (p2.dry - p1.dry) * t, wet: p1.wet + (p2.wet - p1.wet) * t });
    }
  }
  out.push(S[S.length - 1]);
  return out;
}

// Sweep a circle along the stroke → tube. Frames are parallel-transported so the tube doesn't twist.
function buildTube(S, ctr, seed) {
  const n = S.length, M = 20;
  const V = THREE.Vector3;
  const C = S.map(s => new V(s.c[0] - ctr[0], s.c[1] - ctr[1], s.c[2] - ctr[2]));
  const T = C.map((_, i) => new V().subVectors(C[Math.min(n - 1, i + 1)], C[Math.max(0, i - 1)]));
  let last = new V(1, 0, 0);
  for (const t of T) { if (t.lengthSq() < 1e-12) t.copy(last); else { t.normalize(); last = t.clone(); } }
  const N = [], B = [];
  let nrm = new V(0, 0, 1).cross(T[0]); if (nrm.lengthSq() < 1e-6) nrm = new V(0, 1, 0).cross(T[0]); nrm.normalize();
  for (let i = 0; i < n; i++) {
    nrm.sub(T[i].clone().multiplyScalar(nrm.dot(T[i])));
    if (nrm.lengthSq() < 1e-8) { nrm = new V(0, 0, 1).cross(T[i]); if (nrm.lengthSq() < 1e-6) nrm = new V(0, 1, 0).cross(T[i]); }
    nrm.normalize();
    N.push(nrm.clone()); B.push(new V().crossVectors(T[i], nrm));
  }
  const pos = [], uv = [], dry = [], idx = [];
  let vlen = 0;
  for (let i = 0; i < n; i++) {
    if (i) vlen += C[i].distanceTo(C[i - 1]);
    for (let j = 0; j <= M; j++) {
      const a = j / M * Math.PI * 2, r = S[i].r;
      const p = C[i].clone().addScaledVector(N[i], Math.cos(a) * r).addScaledVector(B[i], Math.sin(a) * r);
      pos.push(p.x, p.y, p.z); uv.push(j / M, vlen); dry.push(S[i].dry);
    }
  }
  for (let i = 0; i < n - 1; i++) for (let j = 0; j < M; j++) {
    const a = i * (M + 1) + j, b = a + 1, c = a + M + 1, d = c + 1;
    idx.push(a, c, b, b, c, d);
  }
  // round off both ends with caps
  for (const [i, ring] of [[0, 0], [n - 1, (n - 1) * (M + 1)]]) {
    const ci = pos.length / 3;
    pos.push(C[i].x, C[i].y, C[i].z); uv.push(0.5, i ? vlen : 0); dry.push(S[i].dry);
    for (let j = 0; j < M; j++) idx.push(ci, ring + j, ring + j + 1);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute("uv", new THREE.Float32BufferAttribute(uv, 2));
  geo.setAttribute("aDry", new THREE.Float32BufferAttribute(dry, 1));
  geo.setIndex(idx);
  const mat = new THREE.ShaderMaterial({
    vertexShader: tubeVS, fragmentShader: tubeFS,
    uniforms: { uColor: colorU, uSeed: { value: seed } },
    transparent: true, side: THREE.DoubleSide, depthWrite: false,
  });
  return new THREE.Mesh(geo, mat);
}

function finish() {
  stopCamera();
  const usable = strokes.filter(s => s.samples.length >= 2);
  if (!usable.length) {
    setMode("ready"); statusEl.textContent = "線が書けていませんでした。もう一度どうぞ";
    startCamera().then(() => requestAnimationFrame(loop));
    return;
  }
  initThree(); clearScene();
  $("ink3").value = $("ink").value; applyColor();

  // centre everything so it rotates around the middle of the writing
  const all = usable.flatMap(s => s.samples);
  const min = [0, 1, 2].map(k => Math.min(...all.map(p => p.c[k] - p.r)));
  const max = [0, 1, 2].map(k => Math.max(...all.map(p => p.c[k] + p.r)));
  const ctr = min.map((v, k) => (v + max[k]) / 2);
  viewSpan = Math.max(max[0] - min[0], max[1] - min[1], 0.2);

  for (const st of usable) {
    const S = resample(st.samples);
    group.add(buildTube(S, ctr, st.seed));

    // nijimi: soft blots where the brush lingered
    const bp = [], bs = [], ba = [];
    for (const x of st.samples) {
      if (x.wet < 0.08) continue;
      bp.push(x.c[0] - ctr[0], x.c[1] - ctr[1], x.c[2] - ctr[2]);
      bs.push(x.r * 2 * (1 + 1.2 * x.wet) + 0.01);
      ba.push(0.18 * x.wet);
    }
    if (bp.length) {
      const pg = new THREE.BufferGeometry();
      pg.setAttribute("position", new THREE.Float32BufferAttribute(bp, 3));
      pg.setAttribute("aSize", new THREE.Float32BufferAttribute(bs, 1));
      pg.setAttribute("aAlpha", new THREE.Float32BufferAttribute(ba, 1));
      const pm = new THREE.ShaderMaterial({
        vertexShader: blotVS, fragmentShader: blotFS,
        uniforms: { uColor: colorU, uScale: pointScale }, transparent: true, depthWrite: false,
      });
      group.add(new THREE.Points(pg, pm));
    }
  }
  lastPrint = usable;
  group.scale.z = +$("depth").value / 10;
  setMode("view");
  resize3();
  frontView();
}
function frontView() {
  controls.target.set(0, 0, 0);
  const d = viewSpan / (2 * Math.tan(THREE.MathUtils.degToRad(camera3.fov) / 2)) * 1.35 / Math.min(1, camera3.aspect);
  camera3.position.set(0, 0, d);
  controls.update();
}

// ======================================================================
// 3D printing: export the strokes as a closed STL, sized for a printer.
// Each stroke becomes a round tube capped at both ends. Thin strokes are thickened to MIN_R so they print.
// ======================================================================
const PRINT_SIZE = 100;                      // mm along the longest side
const MIN_R = 0.9;                           // mm: thinnest tube radius that prints reliably
let lastPrint = null;                        // strokes of the piece now on screen
function printTube(S, M = 24) {
  const n = S.length, V = THREE.Vector3;
  const C = S.map(s => new V(...s.c));
  const T = C.map((_, i) => new V().subVectors(C[Math.min(n - 1, i + 1)], C[Math.max(0, i - 1)]));
  let last = new V(1, 0, 0);
  for (const t of T) { if (t.lengthSq() < 1e-12) t.copy(last); else { t.normalize(); last = t.clone(); } }
  let nrm = new V(0, 0, 1).cross(T[0]); if (nrm.lengthSq() < 1e-6) nrm = new V(0, 1, 0).cross(T[0]); nrm.normalize();
  const rings = [];
  for (let i = 0; i < n; i++) {
    nrm.sub(T[i].clone().multiplyScalar(nrm.dot(T[i])));
    if (nrm.lengthSq() < 1e-8) { nrm = new V(0, 0, 1).cross(T[i]); if (nrm.lengthSq() < 1e-6) nrm = new V(0, 1, 0).cross(T[i]); }
    nrm.normalize();
    const b = new V().crossVectors(T[i], nrm), ring = [];
    for (let j = 0; j < M; j++) {
      const a = j / M * Math.PI * 2;
      ring.push(C[i].clone().addScaledVector(nrm, Math.cos(a) * S[i].r).addScaledVector(b, Math.sin(a) * S[i].r));
    }
    rings.push(ring);
  }
  const tris = [];
  for (let i = 0; i < n - 1; i++) for (let j = 0; j < M; j++) {
    const a = rings[i][j], b = rings[i][(j + 1) % M], c = rings[i + 1][j], d = rings[i + 1][(j + 1) % M];
    tris.push([a, c, b], [b, c, d]);
  }
  for (let j = 0; j < M; j++) {
    tris.push([C[0], rings[0][j], rings[0][(j + 1) % M]]);
    tris.push([C[n - 1], rings[n - 1][(j + 1) % M], rings[n - 1][j]]);
  }
  // make every triangle face outward: if the enclosed volume comes out negative, flip them all
  let vol = 0;
  for (const [a, b, c] of tris) vol += a.dot(new V().crossVectors(b, c));
  if (vol < 0) for (const t of tris) [t[1], t[2]] = [t[2], t[1]];
  return tris;
}
// base for printing: a rounded slab under the piece, plus a post from the slab up to the lowest point
// of every stroke, so the whole piece comes off the printer as one connected thing
const BASE_H = 3, BASE_MARGIN = 6, BASE_MIN_DEPTH = 30, POST_R = 1.8;
function prism(poly, z0, z1) {               // closed vertical prism from a convex outline
  const V = THREE.Vector3, n = poly.length;
  const lo = poly.map(([x, y]) => new V(x, y, z0)), hi = poly.map(([x, y]) => new V(x, y, z1));
  const cx = poly.reduce((s, p) => s + p[0], 0) / n, cy = poly.reduce((s, p) => s + p[1], 0) / n;
  const c0 = new V(cx, cy, z0), c1 = new V(cx, cy, z1), tris = [];
  for (let i = 0; i < n; i++) {
    const j = (i + 1) % n;
    tris.push([lo[i], lo[j], hi[i]], [lo[j], hi[j], hi[i]], [c0, lo[j], lo[i]], [c1, hi[i], hi[j]]);
  }
  let vol = 0;
  for (const [a, b, c] of tris) vol += a.dot(new V().crossVectors(b, c));
  if (vol < 0) for (const t of tris) [t[1], t[2]] = [t[2], t[1]];
  return tris;
}
function circle(x, y, r, m = 20) { return Array.from({ length: m }, (_, i) => [x + Math.cos(i / m * Math.PI * 2) * r, y + Math.sin(i / m * Math.PI * 2) * r]); }
function roundedRect(x0, y0, x1, y1, r, m = 6) {
  const pts = [];
  for (const [cx, cy, a0] of [[x1 - r, y1 - r, 0], [x0 + r, y1 - r, 90], [x0 + r, y0 + r, 180], [x1 - r, y0 + r, 270]])
    for (let i = 0; i <= m; i++) { const a = (a0 + i / m * 90) * Math.PI / 180; pts.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]); }
  return pts;
}
// strokes: arrays of {c:[x,y,z] mm, r mm}, already lifted to sit BASE_H above the bed
function baseAndPosts(strokes) {
  const all = strokes.flat();
  let x0 = Math.min(...all.map(p => p.c[0] - p.r)) - BASE_MARGIN, x1 = Math.max(...all.map(p => p.c[0] + p.r)) + BASE_MARGIN;
  let y0 = Math.min(...all.map(p => p.c[1] - p.r)) - BASE_MARGIN, y1 = Math.max(...all.map(p => p.c[1] + p.r)) + BASE_MARGIN;
  if (y1 - y0 < BASE_MIN_DEPTH) { const m = (y0 + y1) / 2; y0 = m - BASE_MIN_DEPTH / 2; y1 = m + BASE_MIN_DEPTH / 2; }
  const tris = prism(roundedRect(x0, y0, x1, y1, 6), 0, BASE_H);
  for (const S of strokes) {
    const low = S.reduce((a, p) => (p.c[2] < a.c[2] ? p : a), S[0]);
    if (low.c[2] - low.r <= BASE_H + 0.2) continue;          // already touching the slab
    tris.push(...prism(circle(low.c[0], low.c[1], Math.min(POST_R, Math.max(low.r, 1.2))), BASE_H - 0.5, low.c[2]));
  }
  return tris;
}
function printStrokesMM(groups) {            // groups of strokes → millimetres, standing on the bed (Z up)
  const depth = +$("depth").value / 10, withBase = $("base").checked;
  const G = groups.map(g => g.map(st => resample(st.samples).map(p => ({ c: [p.c[0], -p.c[2] * depth, p.c[1]], r: p.r }))).filter(S => S.length >= 2));
  const all = G.flat(2);
  const min = [0, 1, 2].map(k => Math.min(...all.map(p => p.c[k] - p.r)));
  const max = [0, 1, 2].map(k => Math.max(...all.map(p => p.c[k] + p.r)));
  const k = PRINT_SIZE / Math.max(...max.map((v, i) => v - min[i]), 1e-6);
  const off = [-(min[0] + max[0]) / 2, -(min[1] + max[1]) / 2, -min[2]];
  const out = G.map(g => g.map(S => S.map(p => ({ c: p.c.map((v, i) => (v + off[i]) * k), r: Math.max(p.r * k, MIN_R) }))));
  // stand it on the bed (or sink it slightly into the base so it fuses)
  const lowest = Math.min(...out.flat(2).map(p => p.c[2] - p.r));
  const dz = (withBase ? BASE_H - 0.6 : 0) - lowest;
  for (const p of out.flat(2)) p.c[2] += dz;
  return out;
}
function exportSTL(prefix) {
  if (!lastPrint) return;
  const [strokesMM] = printStrokesMM([lastPrint]);
  const tris = strokesMM.flatMap(S => printTube(S));
  if ($("base").checked) tris.push(...baseAndPosts(strokesMM));
  const buf = new ArrayBuffer(84 + tris.length * 50), dv = new DataView(buf);
  const head = "kuusho/gassho stroke export (mm)";
  for (let i = 0; i < head.length; i++) dv.setUint8(i, head.charCodeAt(i));
  dv.setUint32(80, tris.length, true);
  let o = 84;
  const e1 = new THREE.Vector3(), e2 = new THREE.Vector3(), nn = new THREE.Vector3();
  for (const [a, b, c] of tris) {
    nn.crossVectors(e1.subVectors(b, a), e2.subVectors(c, a)).normalize();
    for (const v of [nn, a, b, c]) { dv.setFloat32(o, v.x, true); dv.setFloat32(o + 4, v.y, true); dv.setFloat32(o + 8, v.z, true); o += 12; }
    dv.setUint16(o, 0, true); o += 2;
  }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([buf], { type: "model/stl" }));
  a.download = prefix + "-" + new Date().toISOString().slice(0, 19).replace(/[:T]/g, "-") + ".stl";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
$("save").onclick = () => exportSTL("kuusho");
</script>
<script>
// if the main script failed to load (old browser / network), say so instead of leaving a dead button

  if (window.__kuushoReady) return;
  var e = document.getElementById("err");
  if (e) e.textContent = "うまく読み込めませんでした。ページを再読み込みするか、iPad/タブレットのOSとブラウザを最新にしてください。";
}, 8000);
