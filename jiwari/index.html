<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="version" content="1.0">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4efe3">
<title>じわり書き jiwarigaki – 淡墨でにじませて書く v1.0</title>
<meta name="description" content="淡墨で和紙に書く。なぞれば細い線がにじみ、筆を止めれば墨がじわりと広がる。スマホでもPCでも。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Yuji+Syuku&family=Shippori+Mincho:wght@500&display=swap" rel="stylesheet">
<style>
  :root { --bg:#f4efe3; --fg:#2a241d; --mute:#8a7f70; --line:rgba(42,36,29,.16); --acc:#b23a24; --card:rgba(255,250,240,.88); }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg); overflow:hidden; overscroll-behavior:none;
    font-family:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif; -webkit-user-select:none; user-select:none; }
  #cv { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; cursor:crosshair; }
  header { position:fixed; top:calc(14px + env(safe-area-inset-top)); left:calc(16px + env(safe-area-inset-left));
    pointer-events:none; z-index:2; }
  h1 { margin:0; font-family:"Yuji Syuku",serif; font-weight:400; font-size:28px; letter-spacing:.14em; }
  h1 small { display:block; font-family:"Shippori Mincho",serif; font-size:11px; letter-spacing:.32em; color:var(--mute); margin-top:2px; }
  #hint { position:fixed; left:50%; bottom:calc(150px + env(safe-area-inset-bottom)); transform:translateX(-50%); white-space:nowrap; z-index:2; pointer-events:none;
    font-size:15px; letter-spacing:.12em; color:var(--mute); text-align:center; line-height:2; transition:opacity .8s; }
  #hint.off { opacity:0; }
  .bar { position:fixed; left:50%; transform:translateX(-50%); bottom:calc(12px + env(safe-area-inset-bottom)); z-index:3;
    display:flex; flex-wrap:wrap; gap:8px 12px; align-items:center; justify-content:center;
    background:var(--card); border:1px solid var(--line); border-radius:16px; padding:10px 12px; width:min(94vw, 640px);
    -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px); }
  .seg { display:flex; gap:6px; }
  button { font:inherit; font-size:14px; color:var(--fg); background:transparent; border:1px solid var(--line);
    border-radius:10px; padding:7px 12px; cursor:pointer; letter-spacing:.06em; }
  button.on { border-color:var(--fg); }
  button:active { transform:scale(.97); }
  .dot { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:6px; vertical-align:0; }
  label { display:flex; align-items:center; gap:8px; font-size:13px; color:var(--mute); }
  input[type=range] { width:110px; accent-color:var(--fg); }
  #wetv { min-width:1.2em; color:var(--fg); }
  .sp { flex:1; }
  @media (max-width:520px) { .sp { display:none; } h1 { font-size:24px; } }
</style>
</head>
<body>
<canvas id="cv" aria-label="和紙。なぞると淡墨の線がにじみ、止めると墨が広がる"></canvas>
<header><h1>じわり書き<small>JIWARIGAKI</small></h1></header>
<p id="hint">なぞって書く<br>止めると、じわり</p>
<div class="bar">
  <div class="seg" role="group" aria-label="墨の色">
    <button data-k="0" class="on"><span class="dot" style="background:#6e6b6a"></span>淡墨</button>
    <button data-k="1"><span class="dot" style="background:#4d5f86"></span>藍</button>
    <button data-k="2"><span class="dot" style="background:#c0523c"></span>朱</button>
  </div>
  <label>水の量 <input type="range" id="wet" min="1" max="10" step="1" value="3"><span id="wetv">3</span></label>
  <span class="sp"></span>
  <div class="seg">
    <button id="clr">新しい紙</button>
    <button id="save">保存</button>
  </div>
</div>
<script>
(() => {
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const INK = [[0.82,0.84,0.82],[0.84,0.72,0.48],[0.2,0.7,0.8]];
const CONC = 1.4;
let cur = 0, wet = 3;
let NX, NY, NN, CS, W, K, P, D, fW, fP, img, ink, ictx, paperC, lastW = 0;

function noise() {
  const out = new Float32Array(NN);
  [[6,0.5],[14,0.3],[40,0.2]].forEach(([g, amp]) => {
    const gx = Math.ceil(g * NX / Math.min(NX, NY)), gy = Math.ceil(g * NY / Math.min(NX, NY));
    const gr = [];
    for (let i = 0; i <= gy; i++) { gr.push([]); for (let j = 0; j <= gx; j++) gr[i].push(Math.random()); }
    const sc = Math.min(NX, NY) / g;
    for (let y = 0; y < NY; y++) for (let x = 0; x < NX; x++) {
      const fx = x / sc, fy = y / sc, ix = fx | 0, iy = fy | 0, tx = fx - ix, ty = fy - iy;
      const sx = tx * tx * (3 - 2 * tx), sy = ty * ty * (3 - 2 * ty);
      const v = (gr[iy][ix] * (1 - sx) + gr[iy][ix + 1] * sx) * (1 - sy) + (gr[iy + 1][ix] * (1 - sx) + gr[iy + 1][ix + 1] * sx) * sy;
      out[y * NX + x] += v * amp;
    }
  });
  for (let i = 0; i < NN; i++) out[i] = 0.35 + 0.65 * out[i] + (Math.random() - 0.5) * 0.25;
  return out;
}

function reset() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = window.innerWidth, h = window.innerHeight;
  lastW = w;
  CS = Math.max(Math.min(w, h) / 170, Math.sqrt(w * h / 50000));
  NX = Math.ceil(w / CS); NY = Math.ceil(h / CS); NN = NX * NY;
  W = new Float32Array(NN); K = noise();
  P = [0,1,2].map(() => new Float32Array(NN)); D = [0,1,2].map(() => new Float32Array(NN));
  fW = new Float32Array(NN); fP = [0,1,2].map(() => new Float32Array(NN));
  ink = document.createElement('canvas'); ink.width = NX; ink.height = NY;
  ictx = ink.getContext('2d'); img = ictx.createImageData(NX, NY);
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  paperC = document.createElement('canvas'); paperC.width = cv.width; paperC.height = cv.height;
  const p = paperC.getContext('2d'), S = cv.width, T = cv.height, area = w * h / 145000;
  p.fillStyle = '#f4efe3'; p.fillRect(0, 0, S, T);
  for (let i = 0; i < 900 * area; i++) {
    const x = Math.random() * S, y = Math.random() * T, a = Math.random() * 6.3, l = (4 + Math.random() * 18) * dpr;
    p.strokeStyle = 'rgba(150,130,100,' + (0.04 + Math.random() * 0.08) + ')'; p.lineWidth = 0.6 * dpr;
    p.beginPath(); p.moveTo(x, y);
    p.quadraticCurveTo(x + Math.cos(a + 0.5) * l * 0.5, y + Math.sin(a + 0.5) * l * 0.5, x + Math.cos(a) * l, y + Math.sin(a) * l); p.stroke();
  }
  for (let i = 0; i < 2500 * area; i++) { p.fillStyle = 'rgba(120,100,70,' + Math.random() * 0.05 + ')'; p.fillRect(Math.random() * S, Math.random() * T, dpr, dpr); }
}

function blob(cx, cy, rad, water, conc, k) {
  const R = Math.ceil(rad * 2), r2 = rad * rad * 4;
  for (let y = Math.max(0, (cy | 0) - R); y < Math.min(NY, (cy | 0) + R + 1); y++)
    for (let x = Math.max(0, (cx | 0) - R); x < Math.min(NX, (cx | 0) + R + 1); x++) {
      const d2 = (x - cx) ** 2 + (y - cy) ** 2; if (d2 > r2) continue;
      const g = Math.exp(-d2 / (rad * rad)), i = y * NX + x;
      W[i] += water * g; P[k][i] += water * g * conc;
    }
}

function sim() {
  const w = wet / 10, rate = 0.2, evap = 0.0009 * (1.4 - w * 0.6);
  fW.set(W); fP[0].set(P[0]); fP[1].set(P[1]); fP[2].set(P[2]);
  for (let y = 0; y < NY; y++) for (let x = 0; x < NX; x++) {
    const a = y * NX + x;
    for (let d = 0; d < 2; d++) {
      if (d === 0 && x === NX - 1) continue; if (d === 1 && y === NY - 1) continue;
      const b = d === 0 ? a + 1 : a + NX;
      const diff = W[a] - W[b]; if (Math.abs(diff) < 1e-4) continue;
      const src = diff > 0 ? a : b, dst = diff > 0 ? b : a;
      let perm = (K[a] + K[b]) * 0.5;
      if (W[dst] < 0.02) perm *= K[dst] * K[dst] * K[dst] * (W[src] > 0.06 ? 1 : 0.1);
      const f = rate * perm * diff;
      fW[a] -= f; fW[b] += f;
      const s = W[src] > 1e-5 ? Math.abs(f) / W[src] : 0, sg = diff > 0 ? 1 : -1;
      for (let k = 0; k < 3; k++) { const pf = P[k][src] * s * sg; fP[k][a] -= pf; fP[k][b] += pf; }
    }
  }
  for (let i = 0; i < NN; i++) {
    let wv = fW[i] - evap; if (wv < 0) wv = 0; W[i] = wv;
    const dep = wv < 0.005 ? 1 : 0.003 + 0.04 * Math.max(0, 0.12 - wv);
    for (let k = 0; k < 3; k++) { const p = fP[k][i]; if (p <= 0) { P[k][i] = 0; continue; } const t = p * dep; D[k][i] += t; P[k][i] = p - t; }
  }
}

function render() {
  const d = img.data;
  for (let i = 0; i < NN; i++) {
    let r = 0, g = 0, b = 0;
    for (let k = 0; k < 3; k++) { const a = D[k][i] * 1.1 + P[k][i] * 0.7; if (a <= 0) continue; r += a * INK[k][0]; g += a * INK[k][1]; b += a * INK[k][2]; }
    const wd = 1 - 0.06 * Math.min(W[i], 1);
    d[i*4] = 255 * Math.exp(-r) * wd; d[i*4+1] = 255 * Math.exp(-g) * wd; d[i*4+2] = 255 * Math.exp(-b) * wd; d[i*4+3] = 255;
  }
  ictx.putImageData(img, 0, 0);
  ctx.globalCompositeOperation = 'source-over'; ctx.drawImage(paperC, 0, 0);
  ctx.globalCompositeOperation = 'multiply'; ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(ink, 0, 0, NX * CS * cv.width / window.innerWidth, NY * CS * cv.height / window.innerHeight);
  ctx.globalCompositeOperation = 'source-over';
}

function lineTo(L, x, y) {
  const dx = x - L.x, dy = y - L.y, len = Math.hypot(dx, dy); if (len < 0.3) return;
  const w = wet / 10, steps = Math.ceil(len / 0.4), sp = Math.min(len, 6) / 6;
  for (let s = 1; s <= steps; s++) {
    const px = L.x + dx * s / steps, py = L.y + dy * s / steps;
    L.load = Math.max(0.4, L.load - 0.002);
    blob(px, py, 1.1 + 0.6 * w, (0.09 + 0.1 * w) * L.load * (1 - 0.35 * sp), CONC, L.k);
  }
  L.x = x; L.y = y; L.still = 0;
}
function seep(L) {
  if (L.still > 80) return;
  const w = wet / 10, grow = Math.min(1, L.still / 12);
  blob(L.x, L.y, 2 + 1.2 * w + 3.5 * grow, 0.12 + 0.1 * w, CONC, L.k);
  L.still++; L.load = 1;
}

function loop() { for (let s = 0; s < 4; s++) sim(); render(); requestAnimationFrame(loop); }

let down = false, line = null, ax = 0, ay = 0, lastMove = 0, demoTimer = null;
const hint = document.getElementById('hint');
function gpos(e) { return [e.clientX / CS, e.clientY / CS]; }
cv.addEventListener('pointerdown', e => {
  cv.setPointerCapture(e.pointerId); down = true; hint.classList.add('off');
  const [x, y] = gpos(e); ax = x; ay = y; line = { x, y, k: cur, load: 1, still: 0 }; lastMove = performance.now();
  blob(x, y, 1.3 + 0.6 * wet / 10, 0.12, CONC, cur);
});
cv.addEventListener('pointermove', e => {
  if (!down) return; const [x, y] = gpos(e);
  if (Math.hypot(x - ax, y - ay) > 1.2) { lineTo(line, x, y); ax = x; ay = y; lastMove = performance.now(); }
});
setInterval(() => { if (down && line && performance.now() - lastMove > 90) seep(line); }, 30);
function up() { down = false; line = null; }
['pointerup', 'pointercancel'].forEach(t => cv.addEventListener(t, up));

document.querySelectorAll('[data-k]').forEach(b => b.onclick = () => {
  cur = +b.dataset.k; document.querySelectorAll('[data-k]').forEach(o => o.classList.toggle('on', o === b));
});
document.getElementById('wet').oninput = e => { wet = +e.target.value; document.getElementById('wetv').textContent = wet; };
document.getElementById('clr').onclick = () => { reset(); };
document.getElementById('save').onclick = () => {
  cv.toBlob(b => { const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'jiwarigaki.png'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); }, 'image/png');
};

function stroke(pts, k, done) {
  const m = Math.min(NX, NY), ox = (NX - m) / 2, oy = (NY - m) / 2;
  const P2 = p => [ox + p[0] * m, oy + p[1] * m];
  let [sx, sy] = P2(pts[0]); const L = { x: sx, y: sy, k, load: 1, still: 0 };
  let i = 0, t = 0, pause = pts[0][2] || 0;
  demoTimer = setInterval(() => {
    if (down) { clearInterval(demoTimer); return; }
    if (pause > 0) { seep(L); pause--; return; }
    if (i >= pts.length - 1) { clearInterval(demoTimer); done && done(); return; }
    const a = P2(pts[i]), b = P2(pts[i + 1]); t += 0.08; const u = Math.min(t, 1);
    lineTo(L, a[0] + (b[0] - a[0]) * u, a[1] + (b[1] - a[1]) * u);
    if (t >= 1) { t = 0; i++; if (pts[i][2]) pause = pts[i][2]; }
  }, 24);
}
function intro() {
  setTimeout(() => stroke([[0.2,0.3,8],[0.32,0.26],[0.48,0.27],[0.62,0.31],[0.74,0.3,14]], 0, () =>
    stroke([[0.46,0.4,6],[0.47,0.52],[0.45,0.64],[0.4,0.74],[0.32,0.8,12]], 0, () =>
      stroke([[0.6,0.56,5],[0.68,0.64],[0.78,0.72,10]], 0))), 600);
}
window.addEventListener('resize', () => { if (Math.abs(window.innerWidth - lastW) > 40) reset(); });

reset(); loop();
setTimeout(() => hint.classList.add('off'), 9000);
if (!/[?&]nodemo/.test(location.search)) intro();
})();
</script>
</body>
</html>
