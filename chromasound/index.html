      for (const [v, i] of occ) {

        if (i > le) { if (i === le + 1) backToBack++; keep.push([v, i]); lastEnd.set(v, i + L - 1); }
      }
      const c = keep.length;
      if (c < 3 && !(c >= 2 && L >= 6)) continue;
      let score = Math.pow(L, 1.5) * c;            // longer shapes win over fragments that sit inside them

    for (const [v, i] of c.occ) for (let j = 0; j < c.L; j++) if (!marked.has(v[i + j])) { marked.add(v[i + j]); used++; }

  for (const P of parts) if (P.lines) for (const L of P.lines) for (const g of L) g.motif = !!g.note.motif;
}

    } catch (err) { if (authFail(err)) break; bad.push(f.name + (err.message && err.status ? '（' + err.message + '）' : '')); }
  }
  $('adminBox').classList.remove('busy');
  await loadLib();
  toast((ok ? `${ok}曲を登録しました` : '') + (bad.length ? `${ok ? '／' : ''}登録できなかったファイル：${bad.join('、').slice(0, 100)}` : ''), 6000);
};
addEventListener('hashchange', renderAdmin);
renderAdmin();
loadLib();
$('pause').onclick = async () => {
  if (!song) return;
  if (!player.paused) { userPaused = true; player.pause(); $('pause').textContent = '▶'; }
  else { userPaused = false; if (song.ready) player.play().catch(() => {}); $('pause').textContent = '❚❚'; }
};
let idle;
function wake() {
  ['bar', 'top'].forEach(id => $(id).classList.remove('hide')); clearTimeout(idle);
  idle = setTimeout(() => { if (song && $('panel').classList.contains('off')) ['bar', 'top'].forEach(id => $(id).classList.add('hide')); }, 4000);
}
['pointerdown', 'pointermove'].forEach(ev => addEventListener(ev, wake));
// PC: space bar plays / pauses
addEventListener('keydown', e => {
  if (e.key === ' ' && !e.target.closest?.('input,textarea,select,button') && $('panel').classList.contains('off')) { e.preventDefault(); wake(); $('pause').onclick(); }
});

/* ================= drawing ================= */
function frame() {
  cx.globalCompositeOperation = 'source-over';
  cx.fillStyle = 'rgba(7,6,11,.65)';
  cx.fillRect(0, 0, W, H);
  cx.globalCompositeOperation = 'lighter';
  if (song) drawSpiral(); else if (sparks.length) drawSparks();
  requestAnimationFrame(frame);
}

/* light that bursts out where a line changes pitch: lots of little shapes flying apart */
const sparks = []; let lastNow = 0;
const SHAPES = ['dot', 'star', 'tri', 'diamond', 'heart', 'square', 'ring', 'cross', 'note'];
// d = length of the note: a short note gives a small quick pop, a long note sends light drifting slowly and far
function sparkle(x, y, hue, big, dir, d = .4) {
  const k = Math.max(0, Math.min(1, (d - .08) / 1.1)), lerp = (a, b) => a + (b - a) * k;
  const n = Math.round(lerp(big ? 14 : 8, big ? 70 : 46));
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, sp = (big ? 1.3 : 1) * lerp(1.2 + Math.random() * 2.6, .5 + Math.random() * 2.4);
    const shape = Math.random() < .35 ? 'dot' : SHAPES[1 + (Math.random() * (SHAPES.length - 1) | 0)];
    sparks.push({ x, y, vx: Math.cos(a) * sp - lerp(.5, .35), vy: Math.sin(a) * sp - dir * lerp(.8, .5), life: 1,
      decay: 1 / (lerp(14, 150) * (.75 + Math.random() * .5)), fr: lerp(.9, .985), grav: lerp(.02, .004),
      r: (shape === 'dot' ? 1.3 : 4.2) * (big ? 1.35 : 1) * (.6 + Math.random() * .9) * lerp(.75, 1.15), hue: hue + (Math.random() - .5) * 90,
      shape, rot: Math.random() * 6.3, vr: (Math.random() - .5) * lerp(.3, .08), tw: Math.random() * 6.3 });
  }
  const st = Math.round(lerp(2, big ? 8 : 5));
  for (let i = 0; i < st; i++) {                                 // a few streaks of light
    const a = Math.random() * Math.PI * 2, sp = lerp(5, 4) * (.6 + Math.random() * .6);
    sparks.push({ streak: true, x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 1, decay: 1 / (lerp(9, 45) * (.8 + Math.random() * .4)), fr: lerp(.85, .95), hue });
  }
  sparks.push({ ring: true, x, y, r: 3, life: 1, hue, big, grow: lerp(1.6, 2.4) * (big ? 1.3 : 1), fade: 1 / lerp(11, 45) });
  sparks.push({ flash: true, x, y, life: 1, hue, big, size: lerp(.55, 1.2), fade: 1 / lerp(8, 24) });
  if (sparks.length > 1600) sparks.splice(0, sparks.length - 1600);
}
function shapePath(shape, r) {
  cx.beginPath();
  switch (shape) {
    case 'star': for (let i = 0; i < 10; i++) { const a = i / 10 * Math.PI * 2 - Math.PI / 2, rr = i % 2 ? r * .42 : r; cx[i ? 'lineTo' : 'moveTo'](Math.cos(a) * rr, Math.sin(a) * rr); } cx.closePath(); break;
    case 'tri': for (let i = 0; i < 3; i++) { const a = i / 3 * Math.PI * 2 - Math.PI / 2; cx[i ? 'lineTo' : 'moveTo'](Math.cos(a) * r, Math.sin(a) * r); } cx.closePath(); break;
    case 'diamond': cx.moveTo(0, -r * 1.2); cx.lineTo(r * .7, 0); cx.lineTo(0, r * 1.2); cx.lineTo(-r * .7, 0); cx.closePath(); break;
    case 'square': cx.rect(-r * .75, -r * .75, r * 1.5, r * 1.5); break;
    case 'heart': cx.moveTo(0, r * .9); cx.bezierCurveTo(-r * 1.4, -r * .1, -r * .6, -r * 1.2, 0, -r * .4); cx.bezierCurveTo(r * .6, -r * 1.2, r * 1.4, -r * .1, 0, r * .9); cx.closePath(); break;
    case 'ring': cx.arc(0, 0, r, 0, Math.PI * 2); break;
    case 'cross': cx.rect(-r, -r * .22, r * 2, r * .44); cx.rect(-r * .22, -r, r * .44, r * 2); break;
    case 'note': cx.ellipse(-r * .3, r * .55, r * .5, r * .36, -.4, 0, Math.PI * 2); cx.rect(r * .1, -r * 1.1, r * .16, r * 1.65); break;
    default: cx.arc(0, 0, r, 0, Math.PI * 2);
  }
}
function drawSparks() {
  for (let i = sparks.length - 1; i >= 0; i--) {
    const k = sparks[i];
    if (k.flash) {
      k.life -= k.fade; if (k.life <= 0) { sparks.splice(i, 1); continue; }
      const R = (k.big ? 46 : 32) * k.size * (1.25 - k.life * .5);
      const g = cx.createRadialGradient(k.x, k.y, 0, k.x, k.y, R);
      g.addColorStop(0, `hsla(${k.hue}, 100%, 90%, ${k.life * .55})`); g.addColorStop(1, 'transparent');
      cx.fillStyle = g; cx.beginPath(); cx.arc(k.x, k.y, R, 0, Math.PI * 2); cx.fill(); continue;
    }
    if (k.ring) {
      k.r += k.grow; k.life -= k.fade; if (k.life <= 0) { sparks.splice(i, 1); continue; }
      cx.strokeStyle = `hsla(${k.hue}, 100%, 80%, ${k.life * .7})`; cx.lineWidth = 1.4;
      cx.beginPath(); cx.arc(k.x, k.y, k.r, 0, Math.PI * 2); cx.stroke(); continue;
    }
    if (k.streak) {
      k.x += k.vx; k.y += k.vy; k.vx *= k.fr; k.vy *= k.fr; k.life -= k.decay;
      if (k.life <= 0) { sparks.splice(i, 1); continue; }
      cx.strokeStyle = `hsla(${k.hue}, 100%, 85%, ${k.life * .8})`; cx.lineWidth = 1.2 * k.life + .3;
      cx.beginPath(); cx.moveTo(k.x, k.y); cx.lineTo(k.x - k.vx * 3, k.y - k.vy * 3); cx.stroke(); continue;
    }
    k.x += k.vx; k.y += k.vy; k.vx *= k.fr; k.vy = k.vy * k.fr + k.grav; k.rot += k.vr; k.life -= k.decay;
    if (k.life <= 0) { sparks.splice(i, 1); continue; }
    const tw = .65 + .35 * Math.sin(k.life * 24 + k.tw), al = k.life * tw, r = k.r * (.6 + k.life * .5);
    const cs = Math.cos(k.rot), sn = Math.sin(k.rot); cx.setTransform(DPR * cs, DPR * sn, -DPR * sn, DPR * cs, DPR * k.x, DPR * k.y);
    if (k.shape === 'dot') {
      cx.fillStyle = `hsla(${k.hue}, 100%, 70%, ${al * .25})`; cx.beginPath(); cx.arc(0, 0, r * 3, 0, Math.PI * 2); cx.fill();
      cx.fillStyle = `hsla(${k.hue}, 100%, 90%, ${al})`; cx.beginPath(); cx.arc(0, 0, r, 0, Math.PI * 2); cx.fill();
    } else {
      shapePath(k.shape, r);
      if (k.shape === 'ring') { cx.strokeStyle = `hsla(${k.hue}, 100%, 80%, ${al})`; cx.lineWidth = 1.2; cx.stroke(); }
      else { cx.fillStyle = `hsla(${k.hue}, 100%, 75%, ${al * .85})`; cx.fill(); }
    }
    cx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
}
/* 螺旋: the same lines in 3D. Each instrument winds around its own pitch like a corkscrew,
   and the whole stream is turned so the past goes away into the depth. */
function drawSpiral() {
  const m = song, now = songNow(), span = 5, mel = m.parts.filter(p => !p.drums), drum = m.parts.find(p => p.drums);
  const top = H * .14, bot = drum ? H * .76 : H * .8;
  let lo = 127, hi = 0; for (const p of mel) { lo = Math.min(lo, p.lo); hi = Math.max(hi, p.hi); }
  if (hi - lo < 24) { const c = (hi + lo) / 2; lo = c - 12; hi = c + 12; }
  const yOf = n => bot - (n - lo) / (hi - lo) * (bot - top);
  const R = Math.min(18, Math.max(8, (bot - top) / (hi - lo) * 2.5));       // radius of the spiral
  const turns = .28;                                                           // turns per second
  // camera: the time axis is turned away from the viewer (gently swaying)
  const yaw = .32 + Math.sin(performance.now() / 5200) * .06, ca = Math.cos(yaw), sa = Math.sin(yaw), D = Math.max(W, H) * 1.05;
  const len = W * 1.15;                                                       // world length of the time axis
  const raw = (t, y, z) => {                                                  // world -> screen before fitting
    const X = (t - now) / span * len + len / 2, Y = y - H / 2;
    const x2 = X * ca + z * sa, z2 = -X * sa + z * ca, k = D / (D + z2);
    return [x2 * k, Y * k, k];
  };
  const L0 = raw(now - span, H / 2, 0), R0 = raw(now, H / 2, 0);
  const headX = Math.round(W * .7), fit = (headX - 12) / (R0[0] - L0[0]), ox = 12 - L0[0] * fit;
  // fit the picture to the screen height: find how far up/down the highest and lowest notes can reach
  // (nearest and farthest line, both ends of the time axis, the spiral's radius), then scale that into the band
  let yMin = 1e9, yMax = -1e9;
  for (const t of [now - span, now]) for (const z of [-W * .3 - R, W * .3 + R]) for (const y of [top - R, bot + R]) {
    const r = raw(t, y, z)[1]; yMin = Math.min(yMin, r); yMax = Math.max(yMax, r);
  }
  const bandTop = H * .1, bandBot = H * .82, fitY = (bandBot - bandTop) / (yMax - yMin), oy = bandTop - yMin * fitY;
  const P3 = (t, y, z) => { const r = raw(t, y, z); return [r[0] * fit + ox, r[1] * fitY + oy, r[2]]; };
  if (now < lastNow - .5) lastNow = now - .02;
  const LEAD = .03;                                                            // light up a hair early: the eye is slower than the ear
  const crossed = t => t - LEAD > lastNow && t - LEAD <= now, STEPS = 90, dt = span / STEPS;
  const heads = [], t0 = now - span;
  const all = []; mel.forEach(p => p.lines.forEach((L, li) => all.push([p, L, li])));
  cx.lineJoin = cx.lineCap = 'round';
  all.forEach(([p, G, li], pi) => {
    if (!G.length) return;
    const phase = pi / all.length * Math.PI * 2, hue = G.hue, dz = (G.z || 0) * W * .55;
    let a = 0, b = G.length;
    while (a < b) { const mid = (a + b) >> 1; if (G[mid].s <= t0) a = mid + 1; else b = mid; }
    const j0 = Math.max(0, a - 1);
    // sample times: an even grid for the curve, plus every note start and end so short notes are never skipped
    const ts = []; for (let i = 0; i <= STEPS; i++) ts.push(t0 + i * dt);
    for (let j = j0; j < G.length && G[j].s <= now; j++) {
      const g = G[j], e = Math.min(.03, (g.e - g.s) * .4);
      if (g.s > t0) ts.push(g.s, Math.min(now, g.s + e));
      if (g.e > t0 && g.e < now) ts.push(g.e, Math.min(now, g.e + .03));
    }
    ts.sort((x, y) => x - y);
    let j = j0, prevPt = null, prevT = -1e9;
    for (const t of ts) {
      if (t - prevT < .002) continue; prevT = t;
      while (j + 1 < G.length && G[j + 1].s <= t) j++;
      const g = G[j]; if (g.s > t) { prevPt = null; continue; }
      const pg = j > 0 ? G[j - 1] : null, e = Math.min(.03, (g.e - g.s) * .4);
      let n = g.n;
      if (pg && t - g.s < e) { const u = (t - g.s) / e; n = pg.n + (g.n - pg.n) * u * u * (3 - 2 * u); }
      const rest = t > g.e + .02;
      const th = t * turns * Math.PI * 2 + phase;
      const pt = P3(t, yOf(n) + Math.sin(th) * R, dz + Math.cos(th) * R);
      const front = (1 - Math.cos(th)) / 2;
      if (prevPt) {
        const age = (now - t) / span, w0 = (1.4 + g.v * 1.2) * (g.motif && !rest ? 4.2 : 1) * pt[2] * fit;
        const al = (rest ? .22 : (g.motif ? .95 : .8)) * (.22 + .78 * front) * (1 - age * .5);
        cx.strokeStyle = `hsla(${hue}, 95%, ${(g.motif ? 74 : 62) + front * 12}%, ${al})`;
        cx.lineWidth = rest ? 1.3 * pt[2] * fit : w0 * (.7 + front);
        cx.beginPath(); cx.moveTo(prevPt[0], prevPt[1]); cx.lineTo(pt[0], pt[1]); cx.stroke();
        if (g.motif && !rest && front > .5) {
          cx.strokeStyle = `hsla(${hue}, 95%, 60%, ${al * .2})`; cx.lineWidth = w0 * 3.4; cx.stroke();
        }
      }
      prevPt = pt;
    }
    // the head ("now") and the light burst when this line moves to a new note
    const jn = (() => { let x = j0; while (x + 1 < G.length && G[x + 1].s - LEAD <= now) x++; return x; })();
    const g = G[jn];
    if (g && g.s - LEAD <= now && prevPt) {
      const th = now * turns * Math.PI * 2 + phase, hp = P3(now, yOf(g.n) + Math.sin(th) * R, dz + Math.cos(th) * R);
      heads.push([prevPt[0], prevPt[1], hue, g.motif ? 12 : 5, g.e >= now]);
      for (let x = jn; x >= j0 && x >= jn - 3; x--) {                    // every note start passed since the last frame
        const gx = G[x], px = x > 0 ? G[x - 1] : null;
        if (crossed(gx.s) && (!px || px.n !== gx.n || gx.s - px.e > .05))
          sparkle(hp[0], P3(now, yOf(gx.n) + Math.sin(th) * R, dz + Math.cos(th) * R)[1], hue, gx.motif, px ? Math.sign(gx.n - px.n) : 0, gx.note.e - gx.note.s);
      }
    }
  });
  lastNow = now;
  for (const [x, y, hue, r, on] of heads) {
    if (!on) continue;
    const g = cx.createRadialGradient(x, y, 0, x, y, r * 2.2);
    g.addColorStop(0, `hsla(${hue}, 100%, 88%, .9)`); g.addColorStop(1, 'transparent');
    cx.fillStyle = g; cx.beginPath(); cx.arc(x, y, r * 2.2, 0, Math.PI * 2); cx.fill();
  }
  drawSparks();
  if (drum) {
    const yb = H * .84, N = drum.notes; let a = 0, b = N.length;
    while (a < b) { const mid = (a + b) >> 1; if (N[mid].s < now - span) a = mid + 1; else b = mid; }
    for (let i = a; i < N.length && N[i].s <= now; i++) {
      const n = N[i], k = n.n, low = k <= 36, cym = k === 42 || k === 44 || k === 46 || k >= 49;
      const q = P3(n.s, yb + (low ? 6 : cym ? -6 : 0), 0);
      cx.fillStyle = `hsla(${drum.hue}, 90%, ${low ? 55 : cym ? 80 : 68}%, ${.35 + .5 * n.v})`;
      cx.beginPath(); cx.arc(q[0], q[1], (low ? 2.6 : 1.6) * q[2], 0, Math.PI * 2); cx.fill();
    }
  }
}

wake();
requestAnimationFrame(frame);
})();
</script>
